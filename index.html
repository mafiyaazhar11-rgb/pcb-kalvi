<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Learn PCB boards part by part in English and Tamil">
<title>PCB Kalvi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap">
<style>
/* Layout: workbench — sticky toolbar, a dark cutting-mat stage on the left, a reading column on the right */
:root{
  --bg:#eef1ee; --surface:#fbfcfb; --surface2:#e3e9e4; --fg:#16201b; --muted:#56645d; --line:#cdd6d0;
  --accent:#a8571f; --accent-ink:#ffffff; --accent-soft:#f4e3d4; --hl:#ff9a3c;
  --stage:#d5ddd7; --mat-line:rgba(22,60,40,.08); --mat-line2:rgba(22,60,40,.16); --silk-l:#f2f2f2;
  --f-display:"Chakra Petch","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Tamil",system-ui,sans-serif;
  --f-ta:"Noto Sans Tamil","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1311; --surface:#151c19; --surface2:#1c2521; --fg:#e3eae5; --muted:#93a29a; --line:#28332e;
  --accent:#e58c4c; --accent-ink:#1a0f07; --accent-soft:#3a2617; --hl:#ffb062;
  --stage:#0a0f0d; --mat-line:rgba(160,220,190,.05); --mat-line2:rgba(160,220,190,.1); --silk-l:#f2f2f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#151c19; --surface2:#1c2521; --fg:#e3eae5; --muted:#93a29a; --line:#28332e;
  --accent:#e58c4c; --accent-ink:#1a0f07; --accent-soft:#3a2617; --hl:#ffb062;
  --stage:#0a0f0d; --mat-line:rgba(160,220,190,.05); --mat-line2:rgba(160,220,190,.1); --silk-l:#f2f2f2; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
[lang="ta"],.t-ta{font-family:var(--f-ta);line-height:1.75}
code{font-family:var(--f-mono);font-size:.82em;background:var(--surface2);padding:.08em .4em;border-radius:4px;color:var(--fg)}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:1.1;letter-spacing:-.01em}
.t-dual{display:block;font-size:.9em;color:var(--muted);margin-top:.15em}
h1 .t-dual,h2 .t-dual,h3 .t-dual{font-family:var(--f-ta);font-weight:500;letter-spacing:0}
h1 .t-dual{font-size:.55em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding-block:10px;padding-inline:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-ta);font-size:.72rem;color:var(--muted);line-height:1.2}
.search{position:relative;min-width:0}
.search input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 40px;font:inherit;color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.dd{position:absolute;left:0;right:0;top:48px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.18);padding:6px;max-height:70vh;overflow:auto}
.dd-item{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"k m" "k s";gap:0 10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.dd-item:hover,.dd-item.act{background:var(--surface2)}
.dd-kind{grid-area:k;align-self:center;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px}
.dd-main{grid-area:m;font-weight:600}
.dd-sub{grid-area:s;font-size:.85em;color:var(--muted);font-family:var(--f-ta)}
.dd-empty{padding:10px 12px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 11px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.nav{grid-column:1/-1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav a{text-decoration:none;color:var(--muted);font-weight:600;padding:6px 12px;border-radius:8px;white-space:nowrap;font-size:.92rem}
.nav a[aria-current="page"]{color:var(--fg);background:var(--surface2);box-shadow:inset 0 -2px 0 var(--accent)}
@media (max-width:720px){
  .top-in{grid-template-columns:minmax(0,1fr) auto}
  .search{grid-column:1/-1;grid-row:2}
  .nav{grid-row:3}
}

main{max-width:1280px;margin:0 auto;padding-block:22px 60px;padding-inline:16px}
.pagehead{margin-bottom:18px;max-width:70ch}
.lede{color:var(--muted);margin:.5em 0 0}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 4px}
.empty{color:var(--muted);padding:30px 0}

/* library */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:.88rem;display:flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .cnt{font-family:var(--f-mono);font-size:.75em;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.thumb{background:var(--stage);background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);background-size:16px 16px;height:170px;display:flex;align-items:center;justify-content:center;padding:10px}
.thumb svg{max-width:100%;max-height:150px;width:auto;height:100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.card-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card-b h3{font-family:var(--f-display);font-size:1.12rem}
.meta{margin:0;color:var(--muted);font-size:.86rem}
.card-use{margin:4px 0 0;font-size:.9rem}
.card-use .t-dual{font-size:.88em}
.pts{margin:auto 0 0;padding-top:6px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}

/* board view */
.bhead{margin-bottom:16px}
.backlink{display:inline-block;text-decoration:none;font-weight:600;font-size:.9rem;margin-bottom:10px}
.bv{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.colA,.colB{display:flex;flex-direction:column;gap:18px;min-width:0}
.colB{position:sticky;top:120px}
@media (max-width:900px){
  .bv{display:flex;flex-direction:column}
  .colA,.colB{display:contents}
  .stagebox{order:1}.detail{order:2}.points{order:3}.over{order:4}
  .colB{position:static}
}
.stage{position:relative;width:100%;aspect-ratio:5/4;max-height:68vh;min-height:280px;border-radius:var(--r);overflow:hidden;perspective:1400px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;
  background-color:var(--stage);background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px),linear-gradient(var(--mat-line2) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line2) 1px,transparent 1px);background-size:20px 20px,20px 20px,100px 100px,100px 100px}
.stage.dragging{cursor:grabbing}
.b3d{position:absolute;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.75,.2,1),width .45s,height .45s,left .45s,top .45s}
.b3d.noanim{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}
.sidetag{position:absolute;top:10px;left:10px;font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;background:var(--surface);color:var(--fg);padding:3px 8px;border-radius:5px;opacity:.9;pointer-events:none}
.angle{position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
.scalebar{position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);pointer-events:none}
.scalebar span{display:block;height:6px;border:1.5px solid var(--muted);border-top:0}
.scalebar b{font-weight:500}

/* svg internals */
.sl{font-family:var(--f-mono);font-weight:600;pointer-events:none}
.silk{fill:#f4f4f4;opacity:.85;font-family:var(--f-mono);font-weight:600;letter-spacing:.06em;pointer-events:none}
.tr{fill:none;stroke:rgba(255,255,255,.09);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.via{fill:none;stroke:rgba(255,255,255,.16);stroke-width:1}
.holein{fill:var(--stage)}
.hs{cursor:pointer;outline:none}
.hs .hl{fill:transparent;stroke:transparent;stroke-width:1.6;stroke-dasharray:4 3}
.hs:hover .hl{stroke:var(--hl);fill:rgba(255,154,60,.12)}
.hs.on .hl{stroke:var(--hl);stroke-width:2.4;stroke-dasharray:none;fill:rgba(255,154,60,.22);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{fill:rgba(255,154,60,.06)}}
.mk circle{fill:var(--accent);stroke:#fff;stroke-width:1.2}
.mk text{fill:var(--accent-ink);font-family:var(--f-mono);font-weight:700;font-size:7.2px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hs.on .mk circle{fill:var(--hl)}
.nonum .mk{display:none}
@media (prefers-reduced-motion:reduce){.b3d{transition:none}.hs.on .hl{animation:none}.card{transition:none}}

.ctrls{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.crow{display:flex;gap:8px;align-items:center}
.crow.wrap{flex-wrap:wrap}
.crow input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.cb{min-width:40px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.cb.wide{font-size:.86rem}
.cb:hover{border-color:var(--accent)}
.cb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.hint{margin:0;color:var(--muted);font-size:.82rem}
.hint .t-dual{font-size:.95em}

.sec{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0 0 10px}
.sec .t-dual{font-size:.78em}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.pbtn{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.pbtn:hover{border-color:var(--accent)}
.pbtn[aria-current="true"]{border-color:var(--hl);background:var(--accent-soft)}
.pn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-weight:700;font-size:.74rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pt{min-width:0;font-weight:500;font-size:.9rem;line-height:1.35}
.pt .t-dual{font-size:.86em;font-weight:400}
.pt code{display:inline-block;margin-top:3px;font-size:.72rem}
.pt .t-en + code,.pt .t-ta + code{margin-left:0}
.bk{flex:none;margin-left:auto;font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;border:1px dashed var(--muted);color:var(--muted);border-radius:4px;padding:1px 5px;align-self:center}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.d-empty{display:flex;gap:12px;align-items:flex-start;color:var(--muted)}
.d-empty p{margin:0}
.d-ico{font-size:1.4rem;line-height:1}
.d-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;margin-bottom:10px}
.d-num{width:34px;height:34px;border-radius:50%;background:var(--hl);color:#1a0f07;font-family:var(--f-mono);font-weight:700;display:flex;align-items:center;justify-content:center}
.d-title h2{font-family:var(--f-display);font-size:1.3rem;line-height:1.2}
.d-title p{margin:6px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.d-icon svg{width:76px;height:auto;border-radius:6px}
.drow{border-top:1px solid var(--line);padding:10px 0 4px}
.drow h3{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px;font-weight:600}
.drow h3 .t-dual{font-family:var(--f-ta);text-transform:none;letter-spacing:0;font-size:1.05em;display:inline;margin-left:6px}
.drow p{margin:0}
.drow p .t-dual{color:var(--fg);opacity:.86;margin-top:.35em;font-size:.97em}
.d-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.d-count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.listen{margin-left:auto}

.over{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.over .sec{margin-top:10px}
.over .sec:first-child{margin-top:0}
.prose{margin:0 0 6px;max-width:65ch}
.prose .t-dual{color:var(--fg);opacity:.86;margin-top:.4em}
.specs{width:100%;border-collapse:collapse;font-size:.9rem;margin-bottom:6px}
.specs th,.specs td{text-align:left;padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs th{font-weight:500;color:var(--muted);width:42%;padding-right:10px}
.specs th .t-dual{font-size:.85em}
.specs td{font-family:var(--f-mono);font-size:.84rem;font-variant-numeric:tabular-nums}
.uses{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:8px}
.uses li{position:relative;padding-left:20px}
.uses li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--accent)}
.uses .t-dual{font-size:.9em}
.tipbox{margin-top:10px;background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.tipbox h3{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
.tipbox h3 .t-dual{display:inline;margin-left:6px;font-size:1.05em;text-transform:none;letter-spacing:0}
.tipbox p{margin:0}
.tipbox .t-dual{color:var(--fg);opacity:.88}

/* parts */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcard[open]{border-color:var(--accent)}
.pcard summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px;align-items:start}
.pcard summary::-webkit-details-marker{display:none}
.picon svg{width:96px;height:auto;display:block;border-radius:6px}
.pc-t h3{font-family:var(--f-display);font-size:1.02rem;margin-bottom:4px}
.pc-t h3 .t-dual{font-size:.85em}
.pc-t p{margin:0;font-size:.88rem;color:var(--muted)}
.pc-t p .t-dual{color:var(--muted)}
.pc-more{padding:0 12px 12px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:.84rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.links a:hover{border-color:var(--accent)}

/* basics */
.layerfig{margin:0 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.scrollx{overflow-x:auto}
.layers{width:100%;min-width:460px;max-width:720px;display:block}
.layers .lt{fill:var(--fg);font-family:var(--f-body);font-size:10px}
.layers .ln{stroke:var(--muted);stroke-width:.8}
.silklayer{fill:var(--silk-l);stroke:var(--line)}
.layerfig figcaption{margin-top:8px;color:var(--muted);font-size:.86rem}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bn{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);letter-spacing:.06em}
.bcard h3{font-family:var(--f-display);font-size:1.12rem;margin:4px 0 8px}
.bcard h3 .t-dual{font-size:.82em}
.bcard p{margin:0}
.bcard p .t-dual{color:var(--fg);opacity:.86;margin-top:.45em}
.foot{max-width:1280px;margin:0 auto;padding-block:0 30px;padding-inline:16px;color:var(--muted);font-size:.8rem}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gSilver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f4f6"/><stop offset=".55" stop-color="#bcc2c8"/><stop offset="1" stop-color="#dfe3e7"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d27a"/><stop offset=".6" stop-color="#c79a35"/><stop offset="1" stop-color="#e4bf5c"/></linearGradient>
    <linearGradient id="gPin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9ecef"/><stop offset="1" stop-color="#9ea5ac"/></linearGradient>
    <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2c31"/><stop offset="1" stop-color="#141518"/></linearGradient>
    <radialGradient id="gSolder"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#c6ccd2"/><stop offset="1" stop-color="#8d949b"/></radialGradient>

<header class="top">

/* ---------- PARTS DICTIONARY (English + Tamil) ---------- */
const P = {};
function pt(k, i, ne, nt, we, wt, de, dt, te, tt) { P[k] = { k, i, n: [ne, nt], w: [we, wt], d: [de, dt], t: [te, tt] }; }

pt("mcu","chip","Microcontroller (MCU)","மைக்ரோகண்ட்ரோலர் (MCU)",
"A complete small computer on one chip: processor, Flash memory for your program, RAM and input/output pins.",
"ஒரே சிப்பில் உள்ள முழுமையான சிறிய கணினி: ப்ராசசர், உங்கள் program-க்கான Flash நினைவகம், RAM, உள்ளீடு/வெளியீடு பின்கள் அனைத்தும் இதில் உள்ளன.",
"Runs the program you upload, again and again. It reads sensors and buttons, switches LEDs, relays and motors, and talks to other chips.",
"நீங்கள் upload செய்த program-ஐ தொடர்ந்து இயக்குகிறது. சென்சார்கள், பட்டன்களைப் படிக்கிறது; LED, ரிலே, மோட்டார்களை இயக்குகிறது; மற்ற சிப்புகளுடன் தொடர்பு கொள்கிறது.",
"Usually the largest black chip. Search the part number printed on it to get the datasheet and pinout. Never put more than its rated voltage on any pin.",
"பொதுவாக போர்டில் உள்ள பெரிய கருப்பு சிப். அதன் மேல் அச்சிடப்பட்ட part number-ஐ தேடினால் datasheet, pinout கிடைக்கும். எந்த பின்னுக்கும் அதன் rated voltage-க்கு மேல் கொடுக்க வேண்டாம்.");

pt("wifimod","shield","Wi‑Fi module (metal shield)","வைஃபை மாட்யூல் (உலோக மூடி)",
"A small module with the wireless chip, Flash memory and crystal sealed under a metal shield can.",
"வயர்லெஸ் சிப், Flash நினைவகம், கிரிஸ்டல் ஆகியவை உலோக மூடியின் கீழ் அடைக்கப்பட்ட சிறிய மாட்யூல்.",
"Gives the board Wi‑Fi (and Bluetooth on ESP32). On ESP boards this module is also the main processor that runs your code.",
"போர்டுக்கு Wi‑Fi (ESP32-இல் Bluetooth-ம்) வசதியைத் தருகிறது. ESP போர்டுகளில் இதுவே உங்கள் code-ஐ இயக்கும் முக்கிய ப்ராசசர்.",
"The name is printed on the can (ESP-12E, ESP32-WROOM-32). Do not remove the can: it blocks radio noise. It gets slightly warm on Wi‑Fi, which is normal.",
"மாட்யூலின் பெயர் மூடியின் மேல் அச்சிடப்பட்டிருக்கும் (ESP-12E, ESP32-WROOM-32). மூடியை கழற்ற வேண்டாம்; அது ரேடியோ இரைச்சலைத் தடுக்கிறது. Wi‑Fi இயங்கும்போது லேசாக சூடாவது இயல்பு.");

pt("usbserial","chip","USB‑to‑Serial chip","USB‑சீரியல் மாற்றி சிப்",
"A bridge chip such as CH340, CP2102 or ATmega16U2 that converts USB signals into UART serial (TX/RX).",
"CH340, CP2102, ATmega16U2 போன்ற பால சிப். USB சிக்னலை UART சீரியல் (TX/RX) ஆக மாற்றுகிறது.",
"Lets your computer upload programs and read Serial Monitor messages from the board.",
"உங்கள் கணினி program upload செய்யவும், போர்டின் Serial Monitor செய்திகளைப் படிக்கவும் உதவுகிறது.",
"If the PC shows no COM port, install the driver for this exact chip (CH340 or CP2102) and use a data USB cable, not a charge-only cable.",
"PC-யில் COM port தெரியவில்லை என்றால், இந்த சிப்புக்கான driver-ஐ (CH340 அல்லது CP2102) நிறுவுங்கள். சார்ஜ் மட்டும் செய்யும் கேபிள் அல்ல, data USB கேபிள் பயன்படுத்துங்கள்.");

pt("usbb","usbb","USB Type‑B port","USB Type‑B போர்ட்",
"The square, printer-style USB socket.",
"பிரிண்டரில் உள்ளது போன்ற சதுர வடிவ USB சாக்கெட்.",
"Brings 5V power from your computer and carries the upload data.",
"கணினியிலிருந்து 5V மின்சாரத்தையும், upload data-வையும் கொண்டு வருகிறது.",
"A computer USB port gives about 500 mA only. Motors and many relays need a separate power supply.",
"கணினி USB சுமார் 500 mA மட்டுமே தரும். மோட்டார்கள், பல ரிலேக்களுக்கு தனி மின்சாரம் தேவை.");

pt("usbmicro","usbmicro","Micro‑USB port","மைக்ரோ‑USB போர்ட்",
"A small, flat USB socket, the same type used on older Android phones.",
"பழைய Android போன்களில் உள்ள அதே வகை சிறிய, தட்டையான USB சாக்கெட்.",
"Supplies 5V power and the data line for uploading code.",
"5V மின்சாரமும், code upload செய்வதற்கான data இணைப்பும் தருகிறது.",
"The solder joints are weak, so do not bend or pull the cable sideways. If the board lights up but will not upload, try a different (data) cable.",
"இதன் சோல்டர் இணைப்புகள் பலவீனமானவை; கேபிளை வளைக்கவோ பக்கவாட்டில் இழுக்கவோ வேண்டாம். போர்டு எரிகிறது ஆனால் upload ஆகவில்லை என்றால் வேறு data கேபிளை முயற்சிக்கவும்.");

pt("usbmini","usbmicro","Mini‑USB port","மினி‑USB போர்ட்",
"An older USB socket, slightly thicker than Micro‑USB.",
"மைக்ரோ‑USB-ஐ விட சற்று தடிமனான பழைய வகை USB சாக்கெட்.",
"Gives the board 5V power and the upload connection.",
"போர்டுக்கு 5V மின்சாரமும் upload இணைப்பும் தருகிறது.",
"Mini‑USB cables are less common now; keep one in your workshop kit.",
"மினி‑USB கேபிள்கள் இப்போது அரிது; உங்கள் workshop-இல் ஒன்று வைத்துக்கொள்ளுங்கள்.");

pt("usbc","usbc","USB Type‑C port","USB Type‑C போர்ட்",
"The reversible oval USB socket; the plug fits either way up.",
"இரு பக்கமும் பொருந்தும் ஓவல் வடிவ USB சாக்கெட்.",
"Power input, and on many boards also the data line for programming.",
"மின்சார உள்ளீடு; பல போர்டுகளில் program செய்வதற்கான data இணைப்பும் கூட.",
"On Raspberry Pi 4 it is for power only. Use a proper 5V 3A supply, or the Pi will show a low-voltage warning.",
"Raspberry Pi 4-இல் இது மின்சாரத்துக்கு மட்டும். சரியான 5V 3A அடாப்டர் பயன்படுத்துங்கள்; இல்லையெனில் low-voltage எச்சரிக்கை வரும்.");

pt("usba","usba","USB‑A host ports","USB‑A ஹோஸ்ட் போர்ட்கள்",
"Full-size USB sockets like on a laptop.",
"லேப்டாப்பில் உள்ளது போன்ற முழு அளவு USB சாக்கெட்கள்.",
"Connect a keyboard, mouse, pen drive, webcam or USB-serial adapter. Blue sockets are USB 3.0 (faster); black are USB 2.0.",
"கீபோர்டு, மவுஸ், பென் டிரைவ், வெப்கேம், USB-சீரியல் அடாப்டர் இணைக்கலாம். நீல நிற சாக்கெட்கள் USB 3.0 (வேகமானது); கருப்பு USB 2.0.",
"All USB ports share about 1.2 A in total. Use a powered USB hub for hard disks.",
"எல்லா USB போர்ட்களும் சேர்ந்து சுமார் 1.2 A மட்டுமே தரும். ஹார்ட் டிஸ்க்குக்கு powered USB hub பயன்படுத்துங்கள்.");

pt("dcjack","jack","DC barrel jack","DC பவர் ஜாக்",
"A round socket for a wall adapter plug.",
"சுவர் அடாப்டர் பிளக்கை செருகும் வட்ட வடிவ சாக்கெட்.",
"Feeds 7–12V into the on-board regulator so the board can run without a computer.",
"7–12V மின்சாரத்தை போர்டின் ரெகுலேட்டருக்கு அனுப்புகிறது; இதனால் கணினி இல்லாமலேயே போர்டு இயங்கும்.",
"Centre pin is positive (+). Above 12V the regulator becomes very hot; 9V is the sweet spot.",
"நடு பின் பாசிட்டிவ் (+). 12V-க்கு மேல் கொடுத்தால் ரெகுலேட்டர் மிகவும் சூடாகும்; 9V சிறந்தது.");

pt("ldo","reg","Voltage regulator","வோல்டேஜ் ரெகுலேட்டர்",
"A 3-pin chip (AMS1117, NCP1117, ME6211 and similar) that turns a higher voltage into a fixed, steady 5V or 3.3V.",
"அதிக வோல்டேஜை நிலையான 5V அல்லது 3.3V ஆக மாற்றும் 3-பின் சிப் (AMS1117, NCP1117, ME6211 போன்றவை).",
"Protects the chips by giving clean, constant power even when the input voltage changes.",
"உள்ளீட்டு வோல்டேஜ் மாறினாலும் சுத்தமான, நிலையான மின்சாரம் தந்து சிப்புகளைப் பாதுகாக்கிறது.",
"Feeling warm is normal. Test with a multimeter: the output pin should read 3.3V or 5V. If it reads 0V or the input voltage, it is damaged.",
"லேசாக சூடாவது இயல்பு. மல்டிமீட்டரில் சோதிக்கவும்: output பின் 3.3V அல்லது 5V காட்ட வேண்டும். 0V அல்லது input வோல்டேஜ் காட்டினால் அது பழுதானது.");

pt("buckic","reg","Switching (buck) regulator IC","ஸ்விட்சிங் (பக்) ரெகுலேட்டர் IC",
"A regulator that switches on and off very fast instead of burning the extra voltage as heat.",
"அதிக வோல்டேஜை வெப்பமாக வீணாக்காமல், மிக வேகமாக on/off செய்து வேலை செய்யும் ரெகுலேட்டர்.",
"Steps a higher voltage down (for example 12V to 5V) at 80–90% efficiency, so it can supply more current with less heat.",
"அதிக வோல்டேஜை (உதாரணமாக 12V-ஐ 5V ஆக) 80–90% திறனுடன் குறைக்கிறது; இதனால் குறைந்த வெப்பத்தில் அதிக மின்னோட்டம் தர முடியும்.",
"Always set the output voltage with a multimeter before connecting your board.",
"உங்கள் போர்டை இணைக்கும் முன், மல்டிமீட்டர் வைத்து output வோல்டேஜை சரிசெய்யுங்கள்.");

pt("crystal","crystal","Crystal oscillator","கிரிஸ்டல் ஆசிலேட்டர்",
"A quartz part that vibrates at one exact frequency, such as 16 MHz or 8 MHz.",
"ஒரே துல்லியமான அதிர்வெண்ணில் (16 MHz, 8 MHz போன்றவை) அதிரும் குவார்ட்ஸ் பாகம்.",
"Works as the heartbeat clock. Every instruction runs in step with it, so delay(), millis() and serial baud rates stay accurate.",
"இதயத் துடிப்பு போல கடிகாரமாக செயல்படுகிறது. ஒவ்வொரு instruction-ம் இதனுடன் இணைந்து இயங்குவதால் delay(), millis(), serial baud rate துல்லியமாக இருக்கும்.",
"The frequency is printed on the metal case. A wrong or broken crystal shows up as garbage text in the Serial Monitor or a board that will not start.",
"அதிர்வெண் உலோக மூடியின் மேல் அச்சிடப்பட்டிருக்கும். கிரிஸ்டல் தவறானதோ பழுதானதோ என்றால் Serial Monitor-இல் குப்பை எழுத்துகள் வரும், அல்லது போர்டு தொடங்காது.");

pt("reset","button","Reset button","ரீசெட் பட்டன்",
"A small push button wired to the microcontroller's RESET (or EN) pin.",
"மைக்ரோகண்ட்ரோலரின் RESET (அல்லது EN) பின்னுடன் இணைக்கப்பட்ட சிறிய அழுத்து பட்டன்.",
"Restarts your program from the beginning without unplugging power.",
"மின்சாரத்தைத் துண்டிக்காமலேயே உங்கள் program-ஐ ஆரம்பத்திலிருந்து மீண்டும் தொடங்குகிறது.",
"Reset does not erase your program. It only restarts it.",
"Reset உங்கள் program-ஐ அழிக்காது; மீண்டும் தொடங்க மட்டுமே செய்யும்.");

pt("boot","button","BOOT / FLASH button","BOOT / FLASH பட்டன்",
"A push button connected to GPIO0 on ESP boards, or BOOTSEL on Raspberry Pi Pico.",
"ESP போர்டுகளில் GPIO0 உடன், Raspberry Pi Pico-வில் BOOTSEL உடன் இணைக்கப்பட்ட அழுத்து பட்டன்.",
"Holding it while the board resets or powers up puts the chip into download mode, so new firmware can be written.",
"போர்டு reset அல்லது power on ஆகும்போது இதை அழுத்திப் பிடித்தால், சிப் download mode-க்குச் செல்லும்; புதிய firmware எழுத முடியும்.",
"Upload says 'Failed to connect'? Hold BOOT, tap EN/RST once, release BOOT, then upload again.",
"Upload செய்யும்போது 'Failed to connect' வந்தால்: BOOT-ஐ அழுத்திப் பிடித்து, EN/RST-ஐ ஒருமுறை தட்டி, BOOT-ஐ விடுங்கள்; பிறகு மீண்டும் upload செய்யுங்கள்.");

pt("ledpwr","led","Power LED","பவர் LED",
"A small light that turns on when the board has power.",
"போர்டுக்கு மின்சாரம் கிடைக்கும்போது எரியும் சிறிய விளக்கு.",
"A quick check that power is reaching the board.",
"போர்டுக்கு மின்சாரம் வருகிறதா என்று உடனே சரிபார்க்க உதவுகிறது.",
"Not glowing? Check the cable and the supply first. If it goes dim when you connect something, that part may be shorting the power.",
"எரியவில்லையா? முதலில் கேபிள், மின் இணைப்பை சரிபாருங்கள். ஏதாவது இணைத்ததும் மங்கினால், அந்தப் பாகம் மின்சாரத்தை short செய்யலாம்.");

pt("ledbuilt","led","Built‑in LED (user LED)","உள்ளமைந்த LED (யூசர் LED)",
"An LED wired to one GPIO pin, for example pin 13 on Arduino Uno or GPIO2 on ESP boards.",
"ஒரு GPIO பின்னுடன் இணைக்கப்பட்ட LED; உதாரணமாக Arduino Uno-வில் பின் 13, ESP போர்டுகளில் GPIO2.",
"Lets you test your code with the Blink example without any extra wiring.",
"கூடுதல் வயரிங் இல்லாமலேயே Blink உதாரணம் மூலம் உங்கள் code-ஐ சோதிக்க உதவுகிறது.",
"Use LED_BUILTIN in code. On ESP8266 it is active-LOW: writing LOW turns it ON.",
"Code-இல் LED_BUILTIN பயன்படுத்துங்கள். ESP8266-இல் இது active-LOW: LOW எழுதினால் தான் எரியும்.");

pt("ledtxrx","leds","TX / RX LEDs","TX / RX LED-கள்",
"Two LEDs connected to the serial data lines.",
"சீரியல் data வரிகளுடன் இணைக்கப்பட்ட இரண்டு LED-கள்.",
"They blink when data is sent (TX) or received (RX), for example during upload or Serial.print().",
"Data அனுப்பும்போது (TX), பெறும்போது (RX) மினுமினுக்கும்; உதாரணமாக upload அல்லது Serial.print() நேரத்தில்.",
"No blinking during upload means the computer is not talking to the board: check the port, driver and cable.",
"Upload செய்யும்போது மினுமினுக்கவில்லை என்றால் கணினி போர்டுடன் பேசவில்லை: port, driver, கேபிளை சரிபாருங்கள்.");

pt("ledstat","leds","Status LEDs","நிலை (Status) LED-கள்",
"Small indicator LEDs that show what the module is doing.",
"மாட்யூல் என்ன செய்கிறது என்பதைக் காட்டும் சிறிய குறிகாட்டி LED-கள்.",
"Shows states such as charging, done, paired, network found or output ON.",
"சார்ஜ் ஆகிறது, முடிந்தது, இணைந்தது, நெட்வொர்க் கிடைத்தது, output ON போன்ற நிலைகளைக் காட்டுகிறது.",
"Learn the blink pattern from the module's notes; it is the fastest way to debug.",
"மாட்யூலின் மினுமினுப்பு முறையைத் தெரிந்துகொள்ளுங்கள்; பிழை கண்டுபிடிக்க இதுவே எளிய வழி.");

pt("hdrdig","header","Digital I/O pins","டிஜிட்டல் I/O பின்கள்",
"A row of sockets or pins connected to the microcontroller's digital GPIO pins.",
"மைக்ரோகண்ட்ரோலரின் டிஜிட்டல் GPIO பின்களுடன் இணைக்கப்பட்ட சாக்கெட் அல்லது பின் வரிசை.",
"Connect buttons, LEDs, relays, buzzers and sensors here. Pins marked ~ can give PWM output to dim LEDs or control motor speed.",
"பட்டன், LED, ரிலே, பஸ்ஸர், சென்சார்களை இங்கே இணைக்கலாம். ~ குறி உள்ள பின்கள் PWM output தரும்; LED ஒளியைக் குறைக்க, மோட்டார் வேகத்தைக் கட்டுப்படுத்த உதவும்.",
"Each pin gives only about 20 mA. Always use a resistor with an LED, and a transistor or driver for motors and relay coils.",
"ஒவ்வொரு பின்னும் சுமார் 20 mA மட்டுமே தரும். LED-க்கு எப்போதும் resistor பயன்படுத்துங்கள்; மோட்டார், ரிலே காயிலுக்கு transistor அல்லது driver தேவை.");

pt("hdrana","header","Analog input pins","அனலாக் உள்ளீட்டு பின்கள்",
"Pins connected to the ADC (analog-to-digital converter) inside the chip.",
"சிப்பின் உள்ளே உள்ள ADC (அனலாக்-டு-டிஜிட்டல் கன்வெர்ட்டர்) உடன் இணைக்கப்பட்ட பின்கள்.",
"Read changing voltages from potentiometers, LDRs, soil, gas and other analog sensors as a number (0–1023 on Uno).",
"பொட்டென்ஷியோமீட்டர், LDR, மண், வாயு போன்ற அனலாக் சென்சார்களின் மாறும் வோல்டேஜை எண்ணாக (Uno-வில் 0–1023) படிக்கிறது.",
"Never exceed the board's ADC voltage: 5V on Uno, 3.3V on ESP32 and NodeMCU A0. These pins also work as normal digital pins.",
"போர்டின் ADC வோல்டேஜை மீற வேண்டாம்: Uno-வில் 5V, ESP32 மற்றும் NodeMCU A0-வில் 3.3V. இந்த பின்கள் சாதாரண டிஜிட்டல் பின்களாகவும் வேலை செய்யும்.");

pt("hdrpwr","header","Power pins","பவர் பின்கள்",
"Pins labelled 5V, 3.3V, GND and VIN.",
"5V, 3.3V, GND, VIN என்று குறிக்கப்பட்ட பின்கள்.",
"Give power to sensors and modules, or feed power into the board through VIN.",
"சென்சார்கள், மாட்யூல்களுக்கு மின்சாரம் தருகிறது; அல்லது VIN வழியாக போர்டுக்கு மின்சாரம் கொடுக்கலாம்.",
"Never connect 5V directly to GND (short circuit). VIN expects 7–12V; the 5V pin expects clean, regulated 5V only.",
"5V-ஐ நேரடியாக GND-உடன் இணைக்க வேண்டாம் (short circuit). VIN-க்கு 7–12V; 5V பின்னுக்கு சுத்தமான, ரெகுலேட் செய்யப்பட்ட 5V மட்டும்.");

pt("header","header","Pin header","பின் ஹெடர்",
"Metal pins spaced 2.54 mm (0.1 inch) apart, for jumper wires or a breadboard.",
"ஜம்பர் வயர் அல்லது பிரெட்போர்டுக்காக 2.54 mm (0.1 இன்ச்) இடைவெளியில் உள்ள உலோக பின்கள்.",
"Connects the board to other parts: power, ground and signal lines.",
"போர்டை மற்ற பாகங்களுடன் இணைக்கிறது: மின்சாரம், கிரவுண்ட், சிக்னல் வரிகள்.",
"Read the pin names printed on the board before wiring. Swapping VCC and GND can kill a module instantly.",
"வயர் இணைக்கும் முன் போர்டில் அச்சிடப்பட்ட பின் பெயர்களைப் படியுங்கள். VCC, GND மாறினால் மாட்யூல் உடனே பழுதாகலாம்.");

pt("pads","pads","Castellated / solder pads","காஸ்டலேட்டட் / சோல்டர் பேட்கள்",
"Gold-plated holes or half-holes along the board edge.",
"போர்டின் ஓரத்தில் உள்ள தங்க முலாம் பூசிய துளைகள் அல்லது அரை-துளைகள்.",
"Solder pin headers into them for a breadboard, or solder the whole board flat onto another PCB.",
"பிரெட்போர்டில் பயன்படுத்த பின் ஹெடர்களை இதில் சோல்டர் செய்யலாம்; அல்லது முழு போர்டையும் வேறு PCB மேல் தட்டையாக சோல்டர் செய்யலாம்.",
"Heat the pad and pin together for 2–3 seconds, then feed solder. A good joint is shiny and cone-shaped.",
"பேட், பின் இரண்டையும் 2–3 விநாடி சூடாக்கி, பிறகு சோல்டர் கொடுங்கள். நல்ல இணைப்பு பளபளப்பாக, கூம்பு வடிவில் இருக்கும்.");

pt("icsp","header","ICSP header","ICSP ஹெடர்",
"A 2×3 pin header with MISO, MOSI, SCK, RESET, VCC and GND.",
"MISO, MOSI, SCK, RESET, VCC, GND கொண்ட 2×3 பின் ஹெடர்.",
"Programs the chip directly with an external programmer (for example to burn a bootloader) and also gives access to the SPI pins.",
"வெளி programmer மூலம் சிப்பை நேரடியாக program செய்ய (உதாரணமாக bootloader எழுத) உதவுகிறது; SPI பின்களையும் தருகிறது.",
"Pin 1 is marked with a small dot or the number 1 on the silkscreen.",
"பின் 1 சிறிய புள்ளி அல்லது '1' என்று silkscreen-இல் குறிக்கப்பட்டிருக்கும்.");

pt("swd","header","SWD debug pins","SWD டீபக் பின்கள்",
"Four pins: 3.3V, SWDIO, SWCLK and GND.",
"நான்கு பின்கள்: 3.3V, SWDIO, SWCLK, GND.",
"Connect an ST-Link (or a Pico debug probe) to upload code and debug step by step with breakpoints.",
"ST-Link (அல்லது Pico debug probe) இணைத்து code upload செய்யவும், breakpoint வைத்து படிப்படியாக debug செய்யவும் உதவுகிறது.",
"Match the pin names exactly; ST-Link clones print them on the case.",
"பின் பெயர்களைச் சரியாகப் பொருத்துங்கள்; ST-Link-இன் மேல் பின் பெயர்கள் அச்சிடப்பட்டிருக்கும்.");

pt("antenna","antenna","PCB antenna","PCB ஆன்டெனா",
"A zig-zag copper track printed at the board edge.",
"போர்டின் ஓரத்தில் அச்சிடப்பட்ட வளைந்து நெளியும் (zig-zag) செம்பு பாதை.",
"Sends and receives 2.4 GHz radio waves for Wi‑Fi, Bluetooth or RF links.",
"Wi‑Fi, Bluetooth, RF இணைப்புகளுக்கான 2.4 GHz ரேடியோ அலைகளை அனுப்புகிறது, பெறுகிறது.",
"For best range keep the antenna end outside metal boxes and away from wires, batteries and your hand.",
"நல்ல வரம்புக்கு ஆன்டெனா பகுதியை உலோகப் பெட்டிக்கு வெளியே, வயர்கள், பேட்டரி, கையிலிருந்து தள்ளி வையுங்கள்.");

pt("ufl","ufl","U.FL / IPEX antenna connector","U.FL / IPEX ஆன்டெனா கனெக்டர்",
"A tiny snap-on coaxial connector.",
"மிகச்சிறிய, அழுத்திப் பொருத்தும் coaxial கனெக்டர்.",
"Attaches an external antenna for longer range or better signal.",
"அதிக வரம்பு அல்லது நல்ல சிக்னலுக்காக வெளி ஆன்டெனாவை இணைக்கிறது.",
"Very fragile: press straight down to fit and lift straight up to remove. Rated for only about 30 connections.",
"மிகவும் மென்மையானது: நேராக அழுத்திப் பொருத்தி, நேராகத் தூக்கிக் கழற்றுங்கள். சுமார் 30 முறை மட்டுமே இணைக்கத் தாங்கும்.");

pt("capel","cap","Electrolytic capacitor","எலக்ட்ரோலைட்டிக் கெபாசிட்டர்",
"A can-shaped part that stores electric charge. It has + and − legs; the stripe marks negative.",
"மின்னூட்டத்தைச் சேமிக்கும் டப்பா வடிவ பாகம். இதற்கு + மற்றும் − கால்கள் உண்டு; கோடு (stripe) நெகட்டிவைக் குறிக்கும்.",
"Smooths the supply voltage and supplies short bursts of current so the board does not reset when a load switches on.",
"மின் வோல்டேஜை சீராக்குகிறது; சுமை on ஆகும்போது குறுகிய நேர மின்னோட்டம் தந்து போர்டு reset ஆகாமல் தடுக்கிறது.",
"Fitted backwards it can burst. A bulging or leaking top means it must be replaced. Capacitance (µF) and max voltage are printed on the side.",
"தலைகீழாக பொருத்தினால் வெடிக்கலாம். மேல் பகுதி உப்பியிருந்தாலோ கசிந்தாலோ மாற்ற வேண்டும். கொள்ளளவு (µF), அதிகபட்ச வோல்டேஜ் பக்கவாட்டில் அச்சிடப்பட்டிருக்கும்.");

pt("smd","smd","SMD resistors & capacitors","SMD ரெசிஸ்டர்கள் & கெபாசிட்டர்கள்",
"Tiny surface-mount parts. Resistors are black with a number code; ceramic capacitors are tan or brown with no marking.",
"மிகச்சிறிய surface-mount பாகங்கள். ரெசிஸ்டர்கள் கருப்பு நிறத்தில் எண் குறியுடன் இருக்கும்; செராமிக் கெபாசிட்டர்கள் பழுப்பு நிறத்தில், குறி இல்லாமல் இருக்கும்.",
"Resistors limit current and set voltages; small capacitors sit next to chips to filter noise (decoupling).",
"ரெசிஸ்டர்கள் மின்னோட்டத்தைக் கட்டுப்படுத்தி வோல்டேஜை அமைக்கின்றன; சிறிய கெபாசிட்டர்கள் சிப்புகளுக்கு அருகில் இருந்து இரைச்சலை வடிகட்டுகின்றன (decoupling).",
"Resistor code 103 = 10 × 10³ = 10 kΩ; 472 = 4.7 kΩ. Capacitors need an LCR meter to measure.",
"ரெசிஸ்டர் குறி 103 = 10 × 10³ = 10 kΩ; 472 = 4.7 kΩ. கெபாசிட்டரை அளக்க LCR meter தேவை.");

pt("diode","diode","Diode","டயோடு",
"A one-way valve for current. The band marks the cathode (−) side.",
"மின்னோட்டத்துக்கான ஒரு-வழி வால்வு. கோடு (band) உள்ள பக்கம் கேத்தோடு (−).",
"Protects against reversed power, blocks back-flow between USB and external supply, and absorbs spikes from relay coils.",
"தலைகீழ் மின்சாரத்திலிருந்து பாதுகாக்கிறது; USB மற்றும் வெளி மின்சாரம் இடையே பின்னோக்கி பாய்வதைத் தடுக்கிறது; ரிலே காயில் spike-களை உறிஞ்சுகிறது.",
"Multimeter diode mode: about 0.2–0.7V in one direction and OL (open) in the other. OL both ways means it is broken.",
"மல்டிமீட்டர் diode mode-இல் ஒரு திசையில் சுமார் 0.2–0.7V, மறு திசையில் OL காட்டும். இரண்டு திசையிலும் OL என்றால் பழுதானது.");

pt("fuse","smd","Polyfuse (resettable fuse)","பாலிஃப்யூஸ் (தானாக சரியாகும் ஃப்யூஸ்)",
"A small fuse that heats up and limits current when too much flows.",
"அதிக மின்னோட்டம் பாயும்போது சூடாகி அதைக் கட்டுப்படுத்தும் சிறிய ஃப்யூஸ்.",
"Protects your computer's USB port if something on the board shorts.",
"போர்டில் ஏதாவது short ஆனால் உங்கள் கணினியின் USB போர்ட்டைப் பாதுகாக்கிறது.",
"It resets itself: unplug, remove the short, wait a minute and plug in again.",
"இது தானாக சரியாகும்: பிளக்கை எடுத்து, short-ஐ நீக்கி, ஒரு நிமிடம் காத்திருந்து மீண்டும் இணைக்கவும்.");

pt("relay","relay","Relay","ரிலே",
"An electromagnetic switch: a small coil pulls a metal contact open or closed.",
"மின்காந்த ஸ்விட்ச்: ஒரு சிறிய காயில் உலோகத் தொடர்பை இழுத்துத் திறக்கிறது அல்லது மூடுகிறது.",
"Lets a 5V signal from your board switch high-power loads such as lights, fans and pumps (rated up to 10A at 250V AC).",
"உங்கள் போர்டின் 5V சிக்னல் மூலம் விளக்கு, மின்விசிறி, பம்ப் போன்ற அதிக சக்தி சுமைகளை on/off செய்யலாம் (250V AC-யில் 10A வரை).",
"Danger: 230V mains can kill. Wire the mains side only with power OFF and fully insulated. A click sound means the coil is working.",
"ஆபத்து: 230V மின்சாரம் உயிரைப் பறிக்கும். மின் இணைப்பை OFF செய்த பின்பே, முழுமையாக இன்சுலேட் செய்து வயர் இணையுங்கள். 'கிளிக்' சத்தம் கேட்டால் காயில் வேலை செய்கிறது.");

pt("opto","chip","Optocoupler","ஆப்டோகப்ளர்",
"An LED and a light sensor sealed inside one small chip (for example PC817).",
"ஒரு LED-ம் ஒளி சென்சாரும் ஒரே சிறிய சிப்பினுள் அடைக்கப்பட்டது (உதாரணம் PC817).",
"Passes the control signal using light, so the high-power side is electrically isolated from your microcontroller.",
"கட்டுப்பாட்டு சிக்னலை ஒளி மூலம் அனுப்புகிறது; இதனால் அதிக சக்தி பகுதி உங்கள் மைக்ரோகண்ட்ரோலரிலிருந்து மின்சார ரீதியாக பிரிக்கப்படுகிறது.",
"For full isolation on relay boards, remove the JD-VCC jumper and power the relays from a separate 5V supply.",
"ரிலே போர்டுகளில் முழு பிரிப்புக்கு JD-VCC ஜம்பரை எடுத்து, ரிலேக்களுக்கு தனி 5V மின்சாரம் கொடுங்கள்.");

pt("transistor","sot","Transistor","டிரான்சிஸ்டர்",
"A small 3-pin electronic switch or amplifier (for example S8050, 2N2222, AO3400).",
"சிறிய 3-பின் மின்னணு ஸ்விட்ச் அல்லது பெருக்கி (உதாரணம் S8050, 2N2222, AO3400).",
"Uses a tiny GPIO current to switch a bigger load, such as a relay coil, buzzer or LED strip.",
"சிறிய GPIO மின்னோட்டத்தைக் கொண்டு ரிலே காயில், பஸ்ஸர், LED ஸ்ட்ரிப் போன்ற பெரிய சுமைகளை இயக்குகிறது.",
"Always pair it with a flyback diode when driving coils or motors.",
"காயில் அல்லது மோட்டாரை இயக்கும்போது எப்போதும் flyback diode-உடன் பயன்படுத்துங்கள்.");

pt("term","term","Screw terminal","ஸ்க்ரூ டெர்மினல்",
"A block with screws that clamp wires in place.",
"வயர்களை இறுக்கிப் பிடிக்கும் ஸ்க்ரூக்கள் கொண்ட பிளாக்.",
"A secure, solder-free connection for power supplies, motors and high-current loads.",
"மின் விநியோகம், மோட்டார்கள், அதிக மின்னோட்ட சுமைகளுக்கு சோல்டர் இல்லாத உறுதியான இணைப்பு.",
"Strip about 6 mm of insulation and tighten firmly. Loose wires spark and heat up.",
"சுமார் 6 mm இன்சுலேஷனை உரித்து, நன்றாக இறுக்குங்கள். தளர்ந்த வயர்கள் தீப்பொறி உண்டாக்கி சூடாகும்.");

pt("driverIC","to220","Motor driver IC","மோட்டார் டிரைவர் IC",
"A power chip containing H-bridges or step logic (L298N, A4988, DRV8825).",
"H-bridge அல்லது step logic கொண்ட பவர் சிப் (L298N, A4988, DRV8825).",
"Turns weak logic signals into strong currents that drive motors forward, backward and at controlled speed.",
"பலவீனமான logic சிக்னல்களை வலுவான மின்னோட்டமாக மாற்றி மோட்டாரை முன், பின், கட்டுப்படுத்தப்பட்ட வேகத்தில் இயக்குகிறது.",
"These chips get hot, so keep the heat sink on. Never connect a motor directly to a microcontroller pin.",
"இந்த சிப்புகள் சூடாகும்; ஹீட் சிங்கை வைத்திருங்கள். மோட்டாரை நேரடியாக மைக்ரோகண்ட்ரோலர் பின்னுடன் இணைக்க வேண்டாம்.");

pt("heatsink","heatsink","Heat sink","ஹீட் சிங்க்",
"A finned metal block bolted to a power chip.",
"பவர் சிப்புடன் பொருத்தப்பட்ட துடுப்புகள் கொண்ட உலோகக் கட்டி.",
"Spreads and removes heat so the chip does not overheat and shut down.",
"வெப்பத்தைப் பரப்பி வெளியேற்றுகிறது; இதனால் சிப் அதிக சூடாகி நின்றுவிடாது.",
"If you cannot touch it for 3 seconds, reduce the load or add a fan.",
"3 விநாடி தொட முடியாத அளவு சூடாக இருந்தால், சுமையைக் குறைக்கவும் அல்லது மின்விசிறி சேர்க்கவும்.");

pt("pot","pot","Trimmer potentiometer","டிரிம்மர் பொட்டென்ஷியோமீட்டர்",
"A small variable resistor adjusted with a screwdriver.",
"ஸ்க்ரூடிரைவரால் சரிசெய்யும் சிறிய மாறும் ரெசிஸ்டர்.",
"Sets a level: output voltage, sensitivity, delay time or motor current limit, depending on the board.",
"போர்டைப் பொறுத்து output வோல்டேஜ், உணர்திறன், நேர தாமதம் அல்லது மோட்டார் மின்னோட்ட வரம்பை அமைக்கிறது.",
"Turn slowly in small steps and measure after each step. Multi-turn (blue box) trimmers need many turns to change.",
"சிறிது சிறிதாக மெதுவாகத் திருப்பி, ஒவ்வொரு முறையும் அளந்து பாருங்கள். Multi-turn (நீல பெட்டி) டிரிம்மர்களுக்கு பல சுற்றுகள் தேவை.");

pt("inductor","inductor","Inductor (coil)","இண்டக்டர் (காயில்)",
"A coil of wire around a ferrite core that stores energy in a magnetic field.",
"ஃபெரைட் கோர் மேல் சுற்றப்பட்ட வயர் காயில்; காந்தப்புலத்தில் ஆற்றலைச் சேமிக்கிறது.",
"In switching regulators it works with the chip to convert voltage efficiently and smooth the current.",
"ஸ்விட்சிங் ரெகுலேட்டர்களில் சிப்புடன் சேர்ந்து வோல்டேஜைத் திறம்பட மாற்றி, மின்னோட்டத்தை சீராக்குகிறது.",
"A faint whine or buzz under load is normal. The code (100, 330) is the value in µH: 330 = 33 µH.",
"சுமையின் கீழ் லேசான ஒலி இயல்பு. குறி (100, 330) µH மதிப்பு: 330 = 33 µH.");

pt("jumper","jumper","Jumper","ஜம்பர்",
"A small plastic cap with a metal clip that connects two pins.",
"இரண்டு பின்களை இணைக்கும் உலோகக் கிளிப் கொண்ட சிறிய பிளாஸ்டிக் மூடி.",
"Selects a setting without soldering, such as enabling the 5V regulator, boot mode or trigger level.",
"சோல்டர் இல்லாமல் ஒரு அமைப்பைத் தேர்வு செய்கிறது: 5V ரெகுலேட்டரை இயக்குவது, boot mode, trigger level போன்றவை.",
"Change jumpers only with power OFF.",
"மின்சாரம் OFF ஆக இருக்கும்போது மட்டுமே ஜம்பரை மாற்றுங்கள்.");

pt("sensorel","dht","Sensing element","சென்சிங் பகுதி",
"The part that actually reacts to the physical world: heat, humidity, light, motion or sound.",
"வெளி உலகத்துக்கு (வெப்பம், ஈரப்பதம், ஒளி, அசைவு, ஒலி) நேரடியாக எதிர்வினை செய்யும் பகுதி.",
"Changes an electrical property so the module can report a reading.",
"ஒரு மின் பண்பை மாற்றுகிறது; இதனால் மாட்யூல் அளவீட்டைத் தர முடியும்.",
"Keep it clean and away from unrelated heat sources, such as the board's own regulator.",
"சுத்தமாக, தொடர்பில்லாத வெப்ப மூலங்களிலிருந்து (போர்டின் சொந்த ரெகுலேட்டர் போன்றவை) தள்ளி வையுங்கள்.");

pt("comparator","chip","Comparator IC (LM393)","கம்பரேட்டர் IC (LM393)",
"An 8-pin chip that compares the sensor voltage with a threshold you set.",
"சென்சார் வோல்டேஜை நீங்கள் அமைக்கும் வரம்புடன் ஒப்பிடும் 8-பின் சிப்.",
"Gives a clean digital output (DO): HIGH or LOW when the threshold is crossed.",
"வரம்பைத் தாண்டும்போது சுத்தமான டிஜிட்டல் output (DO) தருகிறது: HIGH அல்லது LOW.",
"Set the threshold with the blue trimmer and watch the DO LED change.",
"நீல டிரிம்மரால் வரம்பை அமைத்து, DO LED மாறுவதைப் பாருங்கள்.");

pt("display","display","Display panel","டிஸ்ப்ளே பேனல்",
"A glass OLED panel with its built-in controller (SSD1306).",
"உள்ளமைந்த கண்ட்ரோலர் (SSD1306) கொண்ட கண்ணாடி OLED பேனல்.",
"Shows text, numbers, icons and simple graphics. Each pixel makes its own light, so there is no backlight.",
"எழுத்துகள், எண்கள், ஐகான்கள், எளிய படங்களைக் காட்டுகிறது. ஒவ்வொரு pixel-ம் தானே ஒளிர்வதால் backlight தேவையில்லை.",
"The glass breaks easily; do not press it. Avoid showing the same image for days (burn-in).",
"கண்ணாடி எளிதில் உடையும்; அழுத்த வேண்டாம். ஒரே படத்தை நாள்கணக்கில் காட்ட வேண்டாம் (burn-in).");

pt("fpc","fpc","Flat ribbon connector","தட்டையான ரிப்பன் கனெக்டர்",
"A thin flexible flat cable (FPC) or the socket that holds it.",
"மெல்லிய வளையும் தட்டையான கேபிள் (FPC) அல்லது அதைப் பிடிக்கும் சாக்கெட்.",
"Carries many signals between a camera or display and the main board in a very small space.",
"கேமரா அல்லது டிஸ்ப்ளேக்கும் முக்கிய போர்டுக்கும் இடையே, மிகச் சிறிய இடத்தில் பல சிக்னல்களைக் கொண்டு செல்கிறது.",
"To insert: lift the latch gently, slide the cable in fully with contacts facing the right way, then press the latch down.",
"செருக: லாச்சை மெதுவாகத் தூக்கி, தொடர்புகள் சரியான திசையில் இருக்கும்படி கேபிளை முழுமையாக உள்ளே தள்ளி, லாச்சை அழுத்துங்கள்.");

pt("cam","cam","Camera module","கேமரா மாட்யூல்",
"An image sensor with a lens (OV2640, 2 megapixels on ESP32-CAM).",
"லென்ஸ் கொண்ட இமேஜ் சென்சார் (ESP32-CAM-இல் OV2640, 2 மெகாபிக்சல்).",
"Captures photos and streams video over Wi‑Fi.",
"புகைப்படங்கள் எடுத்து, Wi‑Fi வழியாக வீடியோ ஸ்ட்ரீம் செய்கிறது.",
"Remove the protective film from the lens. A weak 5V supply causes 'brownout' resets when the camera starts.",
"லென்ஸின் பாதுகாப்பு ஃபிலிமை எடுத்துவிடுங்கள். 5V மின்சாரம் பலவீனமாக இருந்தால் கேமரா தொடங்கும்போது 'brownout' reset வரும்.");

pt("sd","sd","microSD card slot","மைக்ரோSD கார்டு ஸ்லாட்",
"A spring socket for a microSD memory card.",
"மைக்ரோSD மெமரி கார்டுக்கான ஸ்பிரிங் சாக்கெட்.",
"Stores the operating system (Raspberry Pi) or saves photos and logs (ESP32-CAM).",
"இயங்குதளத்தை (Raspberry Pi) சேமிக்கிறது, அல்லது புகைப்படங்கள், log-களை (ESP32-CAM) சேமிக்கிறது.",
"Use a Class 10 / A1 card. For Raspberry Pi, write the OS with Raspberry Pi Imager.",
"Class 10 / A1 கார்டு பயன்படுத்துங்கள். Raspberry Pi-க்கு Raspberry Pi Imager மூலம் OS எழுதுங்கள்.");

pt("flash","chip","SPI Flash memory","SPI ஃபிளாஷ் நினைவகம்",
"A small 8-pin memory chip (for example W25Q16, 25Q80).",
"சிறிய 8-பின் நினைவக சிப் (உதாரணம் W25Q16, 25Q80).",
"Stores your program and files. It keeps data even when power is off.",
"உங்கள் program, கோப்புகளைச் சேமிக்கிறது. மின்சாரம் இல்லாதபோதும் data அழியாது.",
"The size is in the part number: 25Q80 = 8 Mbit = 1 MB; W25Q16 = 2 MB.",
"அளவு part number-இல் இருக்கும்: 25Q80 = 8 Mbit = 1 MB; W25Q16 = 2 MB.");

pt("flashled","flashled","Camera flash LED","கேமரா ஃபிளாஷ் LED",
"A bright white LED next to the camera.",
"கேமராவுக்கு அருகில் உள்ள பிரகாசமான வெள்ளை LED.",
"Lights up the scene for photos in the dark (GPIO4 on ESP32-CAM).",
"இருட்டில் புகைப்படம் எடுக்க வெளிச்சம் தருகிறது (ESP32-CAM-இல் GPIO4).",
"It also flashes when the SD card is used, because GPIO4 is shared with the SD card.",
"SD கார்டு பயன்படும்போதும் இது மினுமினுக்கும்; ஏனெனில் GPIO4 SD கார்டுடன் பகிரப்படுகிறது.");

pt("soc","shield","System‑on‑Chip (SoC)","சிஸ்டம்‑ஆன்‑சிப் (SoC)",
"The main processor of a single-board computer: several CPU cores plus a graphics unit (GPU) in one chip.",
"சிங்கிள்-போர்டு கணினியின் முக்கிய ப்ராசசர்: பல CPU core-களும், கிராஃபிக்ஸ் யூனிட்டும் (GPU) ஒரே சிப்பில்.",
"Runs a full operating system such as Raspberry Pi OS (Linux), with desktop, browser, Python and servers.",
"Raspberry Pi OS (Linux) போன்ற முழு இயங்குதளத்தை இயக்குகிறது: desktop, browser, Python, server எல்லாம்.",
"Add a heat sink or fan. Above 80°C it slows itself down (thermal throttling).",
"ஹீட் சிங்க் அல்லது மின்விசிறி சேர்க்கவும். 80°C-க்கு மேல் தானே வேகத்தைக் குறைக்கும் (thermal throttling).");

pt("ram","chip","RAM chip","RAM சிப்",
"Working memory chip (LPDDR4 on Raspberry Pi 4; PSRAM on ESP32-CAM).",
"வேலை நினைவக சிப் (Raspberry Pi 4-இல் LPDDR4; ESP32-CAM-இல் PSRAM).",
"Holds running programs and data while the board is on. It is cleared when power goes off.",
"போர்டு இயங்கும்போது இயங்கும் program-களையும் data-வையும் வைத்திருக்கிறது. மின்சாரம் போனதும் அழிந்துவிடும்.",
"More RAM lets you run more programs together. On the Pi you cannot upgrade it; choose the size when buying.",
"அதிக RAM இருந்தால் பல program-களை ஒரே நேரத்தில் இயக்கலாம். Pi-யில் இதை மாற்ற முடியாது; வாங்கும்போதே அளவைத் தேர்வு செய்யுங்கள்.");

pt("pmic","chip","Power management IC (PMIC)","பவர் மேனேஜ்மென்ட் IC (PMIC)",
"A chip that creates all the different internal voltages the board needs.",
"போர்டுக்குத் தேவையான பல்வேறு உள் வோல்டேஜ்களை உருவாக்கும் சிப்.",
"Turns the 5V input into the 3.3V, 1.8V and core voltages, and switches them on in the right order.",
"5V உள்ளீட்டை 3.3V, 1.8V, core வோல்டேஜ்களாக மாற்றி, சரியான வரிசையில் இயக்குகிறது.",
"Low-voltage warnings on a Pi usually mean a weak power supply, not a bad PMIC.",
"Pi-யில் low-voltage எச்சரிக்கை பொதுவாக பலவீனமான அடாப்டரால் வரும்; PMIC பழுது அல்ல.");

pt("ctrlic","chip","Support / controller chip","துணை / கண்ட்ரோலர் சிப்",
"A helper chip that handles one job, such as USB, signal driving or motion detection logic.",
"USB, சிக்னல் இயக்கம், அசைவு கண்டறிதல் logic போன்ற ஒரு வேலையை மட்டும் கவனிக்கும் துணை சிப்.",
"Takes work off the main processor so the board runs smoothly.",
"முக்கிய ப்ராசசரின் வேலையைக் குறைத்து போர்டு சீராக இயங்க உதவுகிறது.",
"Search the printed part number to learn exactly what it does.",
"அச்சிடப்பட்ட part number-ஐத் தேடி அது சரியாக என்ன செய்கிறது என்று அறியுங்கள்.");

pt("rfic","chip","Radio transceiver chip","ரேடியோ டிரான்ஸ்ஸீவர் சிப்",
"A chip that both transmits and receives radio signals (nRF24L01+, MFRC522).",
"ரேடியோ சிக்னல்களை அனுப்பவும் பெறவும் செய்யும் சிப் (nRF24L01+, MFRC522).",
"Handles the wireless link and gives the data to your microcontroller over SPI.",
"வயர்லெஸ் இணைப்பைக் கையாண்டு, data-வை SPI வழியாக உங்கள் மைக்ரோகண்ட்ரோலருக்குத் தருகிறது.",
"These chips need 3.3V power. 5V on VCC destroys them, though their data pins often tolerate 5V.",
"இந்த சிப்புகளுக்கு 3.3V மின்சாரம் தேவை. VCC-க்கு 5V கொடுத்தால் பழுதாகும்; ஆனால் data பின்கள் பெரும்பாலும் 5V தாங்கும்.");

pt("btmod","subpcb","Bluetooth module board","புளூடூத் மாட்யூல் போர்டு",
"A small green PCB with the Bluetooth radio chip and Flash memory, soldered onto a carrier board.",
"புளூடூத் ரேடியோ சிப், Flash நினைவகம் கொண்ட சிறிய பச்சை PCB; ஒரு carrier போர்டின் மேல் சோல்டர் செய்யப்பட்டது.",
"Creates a wireless serial link: whatever the board sends on TX appears on your phone app, and back.",
"வயர்லெஸ் சீரியல் இணைப்பை உருவாக்குகிறது: போர்டு TX-இல் அனுப்புவது உங்கள் போன் app-இல் தெரியும்; போனிலிருந்து வருவது போர்டுக்கு வரும்.",
"Default PIN is usually 1234 or 0000.",
"இயல்பு PIN பொதுவாக 1234 அல்லது 0000.");

pt("imu","chip","Motion sensor (IMU)","அசைவு சென்சார் (IMU)",
"A MEMS chip with a 3-axis accelerometer and 3-axis gyroscope.",
"3-அச்சு accelerometer, 3-அச்சு gyroscope கொண்ட MEMS சிப்.",
"Measures tilt, acceleration and rotation speed. Used for balancing robots, drones and gesture control.",
"சாய்வு, முடுக்கம், சுழற்சி வேகத்தை அளக்கிறது. சமநிலை ரோபோ, ட்ரோன், சைகைக் கட்டுப்பாட்டுக்குப் பயன்படும்.",
"Mount it flat and firmly; vibration adds noise. Calibrate offsets at startup.",
"தட்டையாக, உறுதியாகப் பொருத்துங்கள்; அதிர்வு இரைச்சலைச் சேர்க்கும். தொடக்கத்தில் offset-களை calibrate செய்யுங்கள்.");

pt("chargeic","chip","Battery charger IC","பேட்டரி சார்ஜர் IC",
"A chip (TP4056) that charges a single 3.7V lithium cell safely.",
"ஒற்றை 3.7V லித்தியம் செல்லைப் பாதுகாப்பாக சார்ஜ் செய்யும் சிப் (TP4056).",
"Charges with constant current, then constant voltage, and stops at 4.2V.",
"முதலில் நிலையான மின்னோட்டத்தில், பிறகு நிலையான வோல்டேஜில் சார்ஜ் செய்து, 4.2V-இல் நிறுத்துகிறது.",
"Default charge current is 1 A. For small batteries, change the PROG resistor to lower it.",
"இயல்பு சார்ஜ் மின்னோட்டம் 1 A. சிறிய பேட்டரிகளுக்கு PROG ரெசிஸ்டரை மாற்றிக் குறைக்கவும்.");

pt("protect","chip","Battery protection chips","பேட்டரி பாதுகாப்பு சிப்புகள்",
"DW01 controller plus FS8205 dual MOSFET switch.",
"DW01 கண்ட்ரோலர் மற்றும் FS8205 இரட்டை MOSFET ஸ்விட்ச்.",
"Cuts the battery off on over-discharge (about 2.5V), over-charge and short circuit.",
"அதிக டிஸ்சார்ஜ் (சுமார் 2.5V), அதிக சார்ஜ், short circuit ஆகியவற்றின்போது பேட்டரியைத் துண்டிக்கிறது.",
"Take the load from OUT+ / OUT−, not directly from B+ / B−, so the protection works.",
"பாதுகாப்பு வேலை செய்ய, சுமையை B+ / B− இலிருந்து அல்ல, OUT+ / OUT− இலிருந்து எடுங்கள்.");

pt("sim","sim","SIM card holder","சிம் கார்டு ஹோல்டர்",
"A sliding or hinged socket for a micro-SIM card.",
"மைக்ரோ-சிம் கார்டுக்கான சறுக்கும் அல்லது கீல் சாக்கெட்.",
"Holds the SIM so the GSM module can join the mobile network for SMS, calls and GPRS data.",
"SMS, அழைப்பு, GPRS data-க்காக GSM மாட்யூல் மொபைல் நெட்வொர்க்கில் சேர சிம்மை வைத்திருக்கிறது.",
"Insert the SIM with the cut corner matching the drawing. The network must still support 2G.",
"வெட்டப்பட்ட மூலை வரைபடத்துடன் பொருந்தும்படி சிம்மைச் செருகுங்கள். நெட்வொர்க் 2G-யை ஆதரிக்க வேண்டும்.");

pt("coil","coil","RFID antenna coil","RFID ஆன்டெனா காயில்",
"A copper loop printed around the board.",
"போர்டைச் சுற்றி அச்சிடப்பட்ட செம்பு வளையம்.",
"Creates a 13.56 MHz magnetic field that powers and reads RFID cards and key tags held near it.",
"13.56 MHz காந்தப்புலத்தை உருவாக்கி, அருகில் வைக்கப்படும் RFID கார்டுகள், key tag-களுக்கு மின்சாரம் தந்து படிக்கிறது.",
"Read range is about 2–5 cm. Metal behind the board reduces range.",
"படிக்கும் தூரம் சுமார் 2–5 cm. போர்டுக்குப் பின்னால் உலோகம் இருந்தால் தூரம் குறையும்.");

pt("dome","dome","Fresnel lens dome","ஃப்ரெஸ்னல் லென்ஸ் டோம்",
"The white plastic dome made of many small lens facets.",
"பல சிறிய லென்ஸ் முகங்கள் கொண்ட வெள்ளை பிளாஸ்டிக் டோம்.",
"Focuses body heat (infrared) from a wide area onto the pyroelectric sensor underneath.",
"பரந்த பகுதியிலிருந்து வரும் உடல் வெப்பத்தை (infrared) கீழே உள்ள pyroelectric சென்சார் மேல் குவிக்கிறது.",
"Lift the dome to see the small metal sensor with a window. Detection range is up to about 7 m.",
"டோமைத் தூக்கினால் ஜன்னல் கொண்ட சிறிய உலோக சென்சார் தெரியும். கண்டறியும் தூரம் சுமார் 7 m வரை.");

pt("usonic","usonic","Ultrasonic transducer","அல்ட்ராசோனிக் டிரான்ஸ்டியூசர்",
"A small speaker / microphone pair that works at 40 kHz, above human hearing.",
"மனித காதுக்குக் கேட்காத 40 kHz-இல் வேலை செய்யும் சிறிய ஸ்பீக்கர் / மைக் ஜோடி.",
"T sends a sound pulse; R listens for the echo. The time taken gives the distance.",
"T ஒலித் துடிப்பை அனுப்புகிறது; R எதிரொலியைக் கேட்கிறது. எடுத்த நேரத்திலிருந்து தூரம் கணக்கிடப்படுகிறது.",
"Distance (cm) = echo time (µs) ÷ 58. Soft surfaces like cloth absorb sound and give wrong readings.",
"தூரம் (cm) = எதிரொலி நேரம் (µs) ÷ 58. துணி போன்ற மென்மையான பரப்புகள் ஒலியை உறிஞ்சி தவறான அளவு தரும்.");

pt("probe","probe","Soil probe","மண் ப்ரோப்",
"A two-prong PCB with exposed copper strips.",
"திறந்த செம்பு பட்டைகள் கொண்ட இரண்டு கால் PCB.",
"Pushed into soil, it measures resistance: wet soil conducts more, dry soil less.",
"மண்ணில் செருகினால் அதன் எதிர்ப்பை அளக்கிறது: ஈரமான மண் அதிகம் கடத்தும், உலர்ந்த மண் குறைவு.",
"Power it only while reading (switch VCC with a GPIO) or the copper corrodes in weeks.",
"படிக்கும்போது மட்டும் மின்சாரம் கொடுங்கள் (GPIO மூலம் VCC-ஐ on/off செய்யுங்கள்); இல்லையெனில் சில வாரங்களில் செம்பு அரிக்கப்படும்.");

pt("audio","audio","3.5 mm audio / video jack","3.5 mm ஆடியோ / வீடியோ ஜாக்",
"A headphone socket with four contacts.",
"நான்கு தொடர்புகள் கொண்ட ஹெட்ஃபோன் சாக்கெட்.",
"Outputs stereo audio and composite video.",
"ஸ்டீரியோ ஒலி மற்றும் composite வீடியோவை வெளியிடுகிறது.",
"Audio quality is basic; use a USB sound card or HDMI for better sound.",
"ஒலித் தரம் சாதாரணம்; சிறந்த ஒலிக்கு USB sound card அல்லது HDMI பயன்படுத்துங்கள்.");

pt("hdmi","hdmi","Micro‑HDMI port","மைக்ரோ‑HDMI போர்ட்",
"A small HDMI socket for a monitor or TV.",
"மானிட்டர் அல்லது டிவிக்கான சிறிய HDMI சாக்கெட்.",
"Sends video and audio. Raspberry Pi 4 can drive two 4K screens.",
"வீடியோ, ஒலியை அனுப்புகிறது. Raspberry Pi 4 இரண்டு 4K திரைகளை இயக்கும்.",
"For one screen use HDMI0, the port next to the USB-C power socket.",
"ஒரு திரைக்கு USB-C மின் சாக்கெட்டுக்கு அருகிலுள்ள HDMI0 பயன்படுத்துங்கள்.");

pt("eth","eth","Ethernet port (RJ45)","ஈதர்நெட் போர்ட் (RJ45)",
"A network socket for a LAN cable, with link and activity LEDs.",
"LAN கேபிளுக்கான நெட்வொர்க் சாக்கெட்; link, activity LED-களுடன்.",
"Gives a wired network connection up to 1 Gbps.",
"1 Gbps வரை வயர் நெட்வொர்க் இணைப்பு தருகிறது.",
"Wired is more stable than Wi‑Fi for servers, cameras and dashboards on a wall screen.",
"Server, கேமரா, சுவர்த் திரை dashboard-களுக்கு Wi‑Fi-ஐ விட வயர் இணைப்பு நிலையானது.");

pt("gpio40","header","40‑pin GPIO header","40‑பின் GPIO ஹெடர்",
"Two rows of 20 pins: GPIO, 5V, 3.3V, GND, and I2C, SPI, UART and PWM functions.",
"20 பின்கள் கொண்ட இரண்டு வரிசைகள்: GPIO, 5V, 3.3V, GND, மற்றும் I2C, SPI, UART, PWM செயல்பாடுகள்.",
"Connects sensors, LEDs, relays, motor drivers and add-on boards called HATs.",
"சென்சார்கள், LED, ரிலே, மோட்டார் டிரைவர், HAT எனப்படும் கூடுதல் போர்டுகளை இணைக்கிறது.",
"Pi GPIO pins are 3.3V only and NOT 5V tolerant. 5V on a GPIO pin can destroy the Pi.",
"Pi GPIO பின்கள் 3.3V மட்டுமே; 5V தாங்காது. GPIO பின்னுக்கு 5V கொடுத்தால் Pi பழுதாகலாம்.");

const BASICS = [
 ["What is a PCB?","PCB என்றால் என்ன?",
  "A Printed Circuit Board is a fiberglass (FR-4) sheet with thin copper paths that connect components, instead of loose wires. Almost every electronic device has one.",
  "Printed Circuit Board என்பது தனித்தனி வயர்களுக்குப் பதிலாக, கூறுகளை (components) இணைக்கும் மெல்லிய செம்பு பாதைகள் கொண்ட ஃபைபர்கிளாஸ் (FR-4) தகடு. ஏறக்குறைய எல்லா மின்னணு சாதனங்களிலும் இது உள்ளது."],
 ["The layers","அடுக்குகள் (Layers)",
  "From the outside in: silkscreen (white text), solder mask (the green, blue or black colour), copper (the wiring) and the FR-4 core. Most hobby boards have 2 copper layers; phones and the Raspberry Pi use 6 or more.",
  "வெளியிலிருந்து உள்ளே: silkscreen (வெள்ளை எழுத்து), solder mask (பச்சை, நீலம், கருப்பு நிறம்), செம்பு (வயரிங்), FR-4 உள்ளகம். பெரும்பாலான hobby போர்டுகளில் 2 செம்பு அடுக்குகள்; போன்கள், Raspberry Pi-யில் 6 அல்லது அதற்கு மேல்."],
 ["Traces and vias","Trace-களும் Via-க்களும்",
  "Traces are the copper roads between parts. A via is a small plated hole that carries a trace from one layer to another. Thicker traces carry more current.",
  "Trace-கள் பாகங்களுக்கு இடையே உள்ள செம்புச் சாலைகள். Via என்பது ஒரு அடுக்கிலிருந்து மற்றொரு அடுக்குக்கு trace-ஐக் கொண்டு செல்லும் சிறிய முலாம் பூசிய துளை. தடிமனான trace-கள் அதிக மின்னோட்டத்தைச் சுமக்கும்."],
 ["Through-hole vs SMD","Through-hole மற்றும் SMD",
  "Through-hole parts have legs that go through holes (easy to hand-solder). SMD (surface-mount) parts sit on pads on the surface; they are smaller and are placed by machines.",
  "Through-hole பாகங்களின் கால்கள் துளைகள் வழியாகச் செல்லும் (கையால் சோல்டர் செய்ய எளிது). SMD (surface-mount) பாகங்கள் மேற்பரப்பில் உள்ள பேட்களில் அமரும்; அவை சிறியவை, இயந்திரங்களால் பொருத்தப்படுபவை."],
 ["Pin headers and 2.54 mm pitch","பின் ஹெடர்களும் 2.54 mm இடைவெளியும்",
  "Most hobby pins are 2.54 mm (0.1 inch) apart, the same spacing as a breadboard. Male headers have pins; female headers have sockets.",
  "பெரும்பாலான hobby பின்கள் 2.54 mm (0.1 இன்ச்) இடைவெளியில் இருக்கும்; பிரெட்போர்டின் அதே இடைவெளி. Male ஹெடரில் பின்கள், female ஹெடரில் சாக்கெட்கள்."],
 ["5V vs 3.3V logic","5V மற்றும் 3.3V லாஜிக்",
  "Arduino Uno and Mega use 5V. ESP8266, ESP32, Pico and Raspberry Pi use 3.3V and can be damaged by 5V on their pins. Use a level shifter or a resistor divider between them.",
  "Arduino Uno, Mega 5V பயன்படுத்துகின்றன. ESP8266, ESP32, Pico, Raspberry Pi 3.3V பயன்படுத்துகின்றன; அவற்றின் பின்களில் 5V பட்டால் பழுதாகலாம். இடையே level shifter அல்லது resistor divider பயன்படுத்துங்கள்."],
 ["GPIO, digital, analog and PWM","GPIO, டிஜிட்டல், அனலாக், PWM",
  "GPIO = general purpose input/output. Digital is only ON or OFF. Analog inputs read a range of voltages. PWM switches a pin on and off very fast to act like a variable voltage (LED dimming, motor speed).",
  "GPIO = பொது பயன்பாட்டு உள்ளீடு/வெளியீடு. டிஜிட்டல் என்றால் ON அல்லது OFF மட்டும். அனலாக் உள்ளீடுகள் வோல்டேஜ் வரம்பைப் படிக்கும். PWM ஒரு பின்னை மிக வேகமாக on/off செய்து மாறும் வோல்டேஜ் போல செயல்படும் (LED ஒளி குறைப்பு, மோட்டார் வேகம்)."],
 ["UART, I2C and SPI","UART, I2C, SPI",
  "Three common ways chips talk. UART uses TX and RX (cross them: TX to RX). I2C uses two wires, SDA and SCL, shared by many devices with addresses. SPI uses MOSI, MISO, SCK and one CS pin per device; it is the fastest.",
  "சிப்புகள் பேசும் மூன்று பொதுவான வழிகள். UART: TX, RX (குறுக்காக இணைக்கவும்: TX-ஐ RX-க்கு). I2C: SDA, SCL என்ற இரண்டு வயர்கள்; முகவரிகள் மூலம் பல சாதனங்கள் பகிரும். SPI: MOSI, MISO, SCK, ஒவ்வொரு சாதனத்துக்கும் ஒரு CS பின்; இதுவே வேகமானது."],
 ["Power and common ground","மின்சாரமும் பொது கிரவுண்டும்",
  "Every connected board and module must share GND, otherwise signals have no reference. Add up the current of all parts and make sure your supply can give it with room to spare.",
  "இணைக்கப்பட்ட எல்லா போர்டுகளும் மாட்யூல்களும் GND-ஐப் பகிர வேண்டும்; இல்லையெனில் சிக்னல்களுக்கு அடிப்படை இருக்காது. எல்லாப் பாகங்களின் மின்னோட்டத்தையும் கூட்டி, உங்கள் மின் விநியோகம் கூடுதல் இருப்புடன் அதைத் தர முடியுமா என்று பாருங்கள்."],
 ["Reading the silkscreen","Silkscreen-ஐப் படிப்பது",
  "The white printing names every part: R = resistor, C = capacitor, D = diode, Q = transistor, U = IC, Y or X = crystal, L = inductor, J or P = connector, SW = switch. Pin 1 is marked by a dot, notch or square pad.",
  "வெள்ளை அச்சு ஒவ்வொரு பாகத்தின் பெயரையும் சொல்கிறது: R = ரெசிஸ்டர், C = கெபாசிட்டர், D = டயோடு, Q = டிரான்சிஸ்டர், U = IC, Y அல்லது X = கிரிஸ்டல், L = இண்டக்டர், J அல்லது P = கனெக்டர், SW = ஸ்விட்ச். பின் 1 புள்ளி, வெட்டு அல்லது சதுர பேட் மூலம் குறிக்கப்படும்."],
 ["Multimeter basics","மல்டிமீட்டர் அடிப்படைகள்",

/* ---------- SVG RENDERER (pure functions) ---------- */
const f = n => Math.round(n * 100) / 100;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const PIN = "url(#gPin)", SIL = "url(#gSilver)", GOLD = "url(#gGold)";
const R = (x, y, w, h, fill, extra = "") => `<rect x="${f(x)}" y="${f(y)}" width="${f(Math.max(w, 0))}" height="${f(Math.max(h, 0))}" fill="${fill}" ${extra}/>`;
const C = (cx, cy, r, fill, extra = "") => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(Math.max(r, 0))}" fill="${fill}" ${extra}/>`;

function lbl(x, y, w, h, t, col, max) {
  if (!t) return "";
  const lines = String(t).split("|");
  const longest = Math.max(...lines.map(l => l.length));
  const fs = Math.max(3, Math.min(max || 9, h / (lines.length * 1.6), (w * 0.9) / (longest * 0.62)));
  const y0 = y + h / 2 - ((lines.length - 1) * fs * 1.15) / 2;
  return lines.map((l, i) => `<text x="${f(x + w / 2)}" y="${f(y0 + i * fs * 1.15)}" font-size="${f(fs)}" fill="${col}" text-anchor="middle" dominant-baseline="central" class="sl">${esc(l)}</text>`).join("");
}

function hdrPins(c) {
  const o = c.o, p = o.p || 10, n = o.n || 1, r = o.r || 1, v = o.o === "v", out = [];
  for (let j = 0; j < r; j++) for (let i = 0; i < n; i++)
    out.push([c.x + (v ? j * p : i * p) + p / 2, c.y + (v ? i * p : j * p) + p / 2, p]);
  return out;
}

/* port mouth on the outward edge */
function mouth(x, y, w, h, e, fill, depth, span) {
  depth = depth || 0.28; span = span || 0.62;
  if (e === "l") return R(x, y + h * (1 - span) / 2, w * depth, h * span, fill);
  if (e === "r") return R(x + w * (1 - depth), y + h * (1 - span) / 2, w * depth, h * span, fill);
  if (e === "t") return R(x + w * (1 - span) / 2, y, w * span, h * depth, fill);
  return R(x + w * (1 - span) / 2, y + h * (1 - depth), w * span, h * depth, fill);
}

function drawComp(c) {
  const { t, x, y, w, h, lb, o } = c;
  let s = "";
  const e = o.e || "l";
  switch (t) {
    case "chip": {
      const pm = o.pins || "q", dip = o.dip;
      const pp = dip ? 10 : Math.max(2.4, Math.min(4.2, Math.min(w, h) / 7));
      const pl = dip ? 4.5 : Math.max(1.8, Math.min(3.2, Math.min(w, h) * 0.11));
      const pw = dip ? 3.4 : pp * 0.5;
      if (pm === "q" || pm === "tb") {
        const n = Math.max(1, Math.floor((w - pp * 0.8) / pp)), off = x + (w - (n - 1) * pp) / 2;
        for (let i = 0; i < n; i++) { const cx = off + i * pp; s += R(cx - pw / 2, y - pl, pw, pl, PIN) + R(cx - pw / 2, y + h, pw, pl, PIN); }
      }
      if (pm === "q" || pm === "lr") {
        const n = Math.max(1, Math.floor((h - pp * 0.8) / pp)), off = y + (h - (n - 1) * pp) / 2;
        for (let i = 0; i < n; i++) { const cy = off + i * pp; s += R(x - pl, cy - pw / 2, pl, pw, PIN) + R(x + w, cy - pw / 2, pl, pw, PIN); }
      }
      s += R(x, y, w, h, o.col || "url(#gChip)", `rx="1.4" stroke="#000" stroke-width=".6"`);
      if (dip) s += `<path d="M${f(x)} ${f(y + h / 2 - 4)} a4 4 0 0 1 0 8" fill="#2b2d31"/>`;
      else s += C(x + Math.min(3.5, w * 0.16), y + Math.min(3.5, h * 0.16), Math.min(1.4, w * 0.06), "#3b3e44");
      s += lbl(x, y, w, h, lb, "#c3c7cd", dip ? 9 : 7.5);
      break;
    }
    case "shield":
      s += R(x, y, w, h, SIL, `rx="1.8" stroke="#80868d" stroke-width=".8"`);
      s += R(x + 2.5, y + 2.5, w - 5, h - 5, "none", `rx="1" stroke="#a1a7ad" stroke-width=".5"`);
      s += lbl(x, y, w, h, lb, "#3a3f46", 9);
      break;
    case "antenna": {
      s += R(x, y, w, h, "rgba(0,0,0,.12)", `rx="1"`);
      const horiz = w >= h, L = horiz ? w : h, n = Math.max(3, Math.floor(L / 6.5)), st = L / n;
      let d = "";
      if (horiz) {
        let px = x + st / 2; d = `M${f(px)} ${f(y + h - 3)}`;
        for (let i = 0; i < n; i++) { const ty = i % 2 === 0 ? y + 3 : y + h - 3; d += ` L${f(px)} ${f(ty)}`; if (i < n - 1) { px += st; d += ` L${f(px)} ${f(ty)}`; } }
      } else {
        let py = y + st / 2; d = `M${f(x + 3)} ${f(py)}`;
        for (let i = 0; i < n; i++) { const tx = i % 2 === 0 ? x + w - 3 : x + 3; d += ` L${f(tx)} ${f(py)}`; if (i < n - 1) { py += st; d += ` L${f(tx)} ${f(py)}`; } }
      }
      s += `<path d="${d}" fill="none" stroke="${GOLD}" stroke-width="2.2" stroke-linejoin="miter"/>`;
      break;
    }
    case "usbb":
      s += R(x, y, w, h, SIL, `rx="1.5" stroke="#7c838a" stroke-width=".8"`);
      s += mouth(x, y, w, h, e, "#2b2e33", 0.18, 0.55);
      s += R(x + w * 0.32, y + h * 0.3, w * 0.5, h * 0.4, "none", `stroke="#9aa1a8" stroke-width=".7"`);
      break;
    case "usbmicro":
    case "usbc":
      s += R(x, y, w, h, SIL, `rx="${t === "usbc" ? Math.min(w, h) * 0.18 : 1.5}" stroke="#7c838a" stroke-width=".8"`);
      s += mouth(x, y, w, h, e, "#26292e", 0.16, 0.6);
      s += R(x + w * 0.25, y + h * 0.25, w * 0.5, h * 0.5, "none", `stroke="#a3a9b0" stroke-width=".6"`);
      break;
    case "usba":
      s += R(x, y, w, h, SIL, `rx="1.5" stroke="#7c838a" stroke-width=".8"`);
      s += mouth(x, y, w, h, e, "#2a2d31", 0.12, 0.84);
      s += mouth(x, y, w, h, e, o.col || "#222", 0.06, 0.5);
      s += R(x + w * 0.2, y + h * 0.48, w * 0.6, 1, "#8d949b");
      break;
    case "eth":
      s += R(x, y, w, h, SIL, `rx="1.5" stroke="#7c838a" stroke-width=".8"`);
      s += mouth(x, y, w, h, e, "#24272b", 0.14, 0.62);
      if (e === "r") { s += R(x + w - 6, y + 3, 5, 6, "#38d16a") + R(x + w - 6, y + h - 9, 5, 6, "#ffb000"); }
      else { s += R(x + 1, y + 3, 5, 6, "#38d16a") + R(x + 1, y + h - 9, 5, 6, "#ffb000"); }
      break;
    case "hdmi":
      s += R(x, y, w, h, SIL, `rx="1.2" stroke="#7c838a" stroke-width=".8"`);
      s += mouth(x, y, w, h, e, "#24272b", 0.22, 0.66);
      s += lbl(x, y + h * 0.15, w, h * 0.45, lb ? "HDMI" + lb : "HDMI", "#4a5058", 5);
      break;
    case "jack":
      s += R(x, y, w, h, "#18191b", `rx="2" stroke="#000" stroke-width=".8"`);
      s += C(e === "l" ? x + w * 0.22 : x + w * 0.78, y + h / 2, h * 0.3, "#050505", `stroke="#3a3a3a" stroke-width="1"`);
      s += C(e === "l" ? x + w * 0.22 : x + w * 0.78, y + h / 2, h * 0.08, "#9aa0a6");
      break;
    case "audio":
      s += R(x, y, w, h, "#18191b", `rx="2" stroke="#000" stroke-width=".8"`);
      s += C(x + w / 2, e === "b" ? y + h * 0.78 : y + h * 0.22, w * 0.28, "#050505", `stroke="#3a3a3a"`);
      break;
    case "header": case "jhdr": {
      const pins = hdrPins(c);
      s += R(x, y, w, h, o.f ? "#151515" : "#1d1d1f", `rx="1"`);
      pins.forEach(([cx, cy, p]) => {
        if (o.f) s += R(cx - p * 0.22, cy - p * 0.22, p * 0.44, p * 0.44, "#000", `stroke="#4a4436" stroke-width=".6"`);
        else s += R(cx - p * 0.19, cy - p * 0.19, p * 0.38, p * 0.38, GOLD, `stroke="#7d5f1d" stroke-width=".4"`);
      });
      if (t === "jhdr") {
        const p = o.p || 10, r = o.r || 1, caps = o.cap || 2;
        for (let j = 0; j < r; j++) s += R(x + 0.8, y + j * p + 0.8, caps * p - 1.6, p - 1.6, "#1b1b1d", `rx="1.2" stroke="#55585e" stroke-width=".6"`);
      }
      break;
    }
    case "pads":
      hdrPins(c).forEach(([cx, cy, p]) => { s += C(cx, cy, p * 0.37, GOLD, `stroke="#8a6a22" stroke-width=".4"`) + C(cx, cy, p * 0.16, "rgba(0,0,0,.55)"); });
      break;
    case "crystal":
      if (o.smd) { s += R(x, y, w, h, SIL, `rx="1" stroke="#80868d" stroke-width=".6"`); s += lbl(x, y, w, h, lb, "#3a3f46", 5); }
      else { s += R(x, y, w, h, SIL, `rx="${h / 2}" stroke="#7c838a" stroke-width=".8"`); s += lbl(x, y, w, h, lb, "#3a3f46", 6); }
      break;
    case "button": {
      s += R(x, y, w, h, "#2b2d31", `rx="1.2" stroke="#111" stroke-width=".6"`);
      const k = Math.min(w, h) * 0.12;
      [[x, y], [x + w - k, y], [x, y + h - k], [x + w - k, y + h - k]].forEach(([a, b]) => { s += R(a, b, k, k, "#9aa0a6"); });
      s += C(x + w / 2, y + h / 2, Math.min(w, h) * 0.3, o.col || "#121212", `stroke="#555" stroke-width=".8"`);
      if (lb && Math.min(w, h) >= 16) s += lbl(x, y + h * 0.8, w, h * 0.22, lb, "#e9ecef", 3.6);
      break;
    }
    case "led":
      s += R(x, y, w, h, "#d9dde1", `rx=".6"`);
      s += R(x + w * 0.18, y, w * 0.64, h, o.col || "#ff3b30", `rx=".6"`);
      s += R(x + w * 0.3, y + h * 0.22, w * 0.25, h * 0.4, "rgba(255,255,255,.7)", `rx=".4"`);
      break;
    case "leds": {
      const n = o.n || 2, cols = o.cols || ["#ff3b30", "#30d158", "#ffb000"];
      for (let i = 0; i < n; i++) {
        const lw = o.h ? w / n - 2 : w, lh = o.h ? h : h / n - 2;
        const lx = o.h ? x + i * (w / n) : x, ly = o.h ? y : y + i * (h / n);
        s += R(lx, ly, lw, lh, "#d9dde1", `rx=".5"`) + R(lx + lw * 0.18, ly, lw * 0.64, lh, cols[i % cols.length], `rx=".5"`) + R(lx + lw * 0.3, ly + lh * 0.2, lw * 0.22, lh * 0.4, "rgba(255,255,255,.65)");
      }
      break;
    }
    case "smd":
      s += R(x, y, w, h, o.col || "#1b1c1f", `rx=".5"`);
      s += R(x, y, w * 0.2, h, SIL) + R(x + w * 0.8, y, w * 0.2, h, SIL);
      if (lb) s += lbl(x + w * 0.2, y, w * 0.6, h, lb, "#e6e6e6", 5);
      break;
    case "sot":
      s += R(x + w * 0.15, y - 2, w * 0.18, 2.4, PIN) + R(x + w * 0.67, y - 2, w * 0.18, 2.4, PIN) + R(x + w * 0.41, y + h - 0.4, w * 0.18, 2.4, PIN);
      s += R(x, y, w, h, "#18191c", `rx=".8"`);
      if (lb) s += lbl(x, y, w, h, lb, "#c3c7cd", 4);
      break;
    case "cap": {
      const r = Math.min(w, h) / 2, cx = x + w / 2, cy = y + h / 2;
      s += C(cx, cy, r, o.col || "#1d2433", `stroke="#000" stroke-width=".6"`);
      s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r * 0.92)}" fill="none" stroke="#c7cbd0" stroke-width="${f(r * 0.16)}" stroke-dasharray="${f(r * 1.4)} ${f(r * 6)}" opacity=".9"/>`;
      s += C(cx, cy, r * 0.76, SIL, `stroke="#7b8188" stroke-width=".6"`);
      s += `<path d="M${f(cx - r * 0.45)} ${f(cy)} H${f(cx + r * 0.45)} M${f(cx)} ${f(cy - r * 0.45)} V${f(cy + r * 0.45)}" stroke="#8d949b" stroke-width="1.1"/>`;
      break;
    }
    case "reg": {
      s += R(x + w * 0.2, y, w * 0.6, h * 0.3, SIL, `stroke="#7c838a" stroke-width=".5"`);
      [0.15, 0.42, 0.69].forEach(k => { s += R(x + w * k, y + h * 0.82, w * 0.16, h * 0.18, PIN); });
      s += R(x, y + h * 0.24, w, h * 0.6, "#17181b", `rx=".8" stroke="#000" stroke-width=".5"`);
      if (lb) s += lbl(x, y + h * 0.24, w, h * 0.6, lb, "#c3c7cd", 6);
      break;
    }
    case "to220": {
      if (o.multi) {
        s += R(x, y + h * 0.45, w, h * 0.45, "#141517", `rx="1" stroke="#000"`);
        const n = 15; for (let i = 0; i < n; i++) s += R(x + 3 + i * (w - 6) / n, y + h * 0.9, (w - 6) / n * 0.5, h * 0.12, PIN);
        s += R(x - 2, y, w + 4, h * 0.48, SIL, `stroke="#7c838a" stroke-width=".6"`);
        s += lbl(x, y + h * 0.45, w, h * 0.45, lb, "#c3c7cd", 8);
      } else {
        s += R(x + w * 0.05, y, w * 0.9, h * 0.38, SIL, `stroke="#7c838a"`) + C(x + w / 2, y + h * 0.18, Math.min(w, h) * 0.1, "#2a2d31");
        s += R(x, y + h * 0.34, w, h * 0.42, "#141517", `stroke="#000"`);
        [0.2, 0.45, 0.7].forEach(k => { s += R(x + w * k, y + h * 0.76, w * 0.1, h * 0.24, PIN); });
        s += lbl(x, y + h * 0.34, w, h * 0.42, lb, "#c3c7cd", 7);
      }
      break;
    }
    case "relay":
      s += R(x, y, w, h, o.col || "#2563c8", `rx="2" stroke="#123a7a" stroke-width="1"`);
      s += R(x + 3, y + 3, w - 6, h - 6, "none", `rx="1.5" stroke="rgba(255,255,255,.28)" stroke-width=".6"`);
      s += lbl(x, y, w, h, lb, "#eef3ff", 8);
      break;
    case "term": {
      const n = o.n || 2, horiz = w >= h;
      s += R(x, y, w, h, o.col || "#2a6fd6", `rx="1.6" stroke="#174a94" stroke-width=".8"`);
      for (let i = 0; i < n; i++) {
        const cx = horiz ? x + (i + 0.5) * w / n : x + w / 2, cy = horiz ? y + h / 2 : y + (i + 0.5) * h / n;
        const r = Math.min(horiz ? w / n : w, horiz ? h : h / n) * 0.32;
        s += C(cx, cy, r, SIL, `stroke="#6c737a" stroke-width=".6"`);
        s += `<path d="M${f(cx - r * 0.7)} ${f(cy - r * 0.7)} L${f(cx + r * 0.7)} ${f(cy + r * 0.7)}" stroke="#555b62" stroke-width="${f(r * 0.28)}"/>`;
      }
      break;
    }
    case "heatsink":
      s += R(x, y, w, h, "#1b1c1f", `rx="1" stroke="#000"`);
      for (let fx = x + 4; fx < x + w - 2; fx += 6) s += R(fx, y + 2, 2.4, h - 4, "#33363b");
      s += C(x + w / 2, y + h * 0.18, 3, "#0d0d0e", `stroke="#4a4d52"`);
      break;
    case "pot": {
      s += R(x, y, w, h, "#2f66cf", `rx="1.5" stroke="#1b448f" stroke-width=".7"`);
      const r = Math.min(w, h) * 0.34, cx = x + w / 2, cy = y + h / 2;
      s += C(cx, cy, r, o.brass ? GOLD : "#f2f2f2", `stroke="#9aa0a6" stroke-width=".6"`);
      s += `<path d="M${f(cx - r * 0.75)} ${f(cy)} H${f(cx + r * 0.75)} M${f(cx)} ${f(cy - r * 0.75)} V${f(cy + r * 0.75)}" stroke="#7a7f86" stroke-width="${f(r * 0.22)}"/>`;
      if (lb) s += lbl(x, y + h * 0.78, w, h * 0.22, lb, "#ffffff", 4);
      break;
    }
    case "inductor": {
      s += R(x, y, w, h, "#2b2c30", `rx="3" stroke="#111"`);
      const r = Math.min(w, h) * 0.36;
      s += C(x + w / 2, y + h / 2, r, "#1a1b1e", `stroke="#b8733a" stroke-width="${f(Math.max(1.2, r * 0.16))}"`);
      if (lb) s += lbl(x, y, w, h, lb, "#c3c7cd", 7);
      break;
    }
    case "diode":
      s += R(x, y, w, h, "#18191c", `rx="${o.smd ? 0.6 : h / 2}"`);
      if (o.smd) s += R(x, y, w * 0.14, h, SIL) + R(x + w * 0.86, y, w * 0.14, h, SIL);
      s += R(x + w * 0.18, y, w * 0.1, h, "#cfd3d8");
      if (lb && w > 20) s += lbl(x + w * 0.3, y, w * 0.55, h, lb, "#c3c7cd", 5);
      break;
    case "jumper":
      s += R(x, y, w, h, o.col || "#1b1b1d", `rx="1.4" stroke="#55585e" stroke-width=".6"`);
      if (lb) s += lbl(x, y, w, h, lb, "#e6e6e6", 5);
      break;
    case "ufl": {
      const r = Math.min(w, h) / 2, cx = x + w / 2, cy = y + h / 2;
      s += R(x, y, w, h, SIL, `rx=".8"`) + C(cx, cy, r * 0.8, GOLD) + C(cx, cy, r * 0.45, "#2a2d31") + C(cx, cy, r * 0.15, GOLD);
      break;
    }
    case "sd":
      s += `<path d="M${f(x)} ${f(y)} H${f(x + w - 8)} L${f(x + w)} ${f(y + 8)} V${f(y + h)} H${f(x)} Z" fill="${SIL}" stroke="#7c838a" stroke-width=".8"/>`;
      s += R(x + 4, y + h * 0.15, w * 0.7, 1, "#9aa1a8") + R(x + 4, y + h * 0.85, w * 0.7, 1, "#9aa1a8");
      s += lbl(x, y, w, h, "microSD", "#4a5058", 7);
      break;
    case "sim":
      s += `<path d="M${f(x)} ${f(y)} H${f(x + w - 12)} L${f(x + w)} ${f(y + 12)} V${f(y + h)} H${f(x)} Z" fill="${SIL}" stroke="#7c838a" stroke-width=".8"/>`;
      for (let i = 1; i < 6; i++) s += R(x + 6, y + i * h / 6, w * 0.55, 0.8, "#9aa1a8");
      s += lbl(x + w * 0.5, y + h * 0.6, w * 0.45, h * 0.3, "SIM", "#4a5058", 8);
      break;
    case "cam": {
