const BASICS = [
 ["What is a PCB?","PCB என்றால் என்ன?",
  "A Printed Circuit Board is a fiberglass (FR-4) sheet with thin copper paths that connect components, instead of loose wires. Almost every electronic device has one.",
  "Printed Circuit Board என்பது தனித்தனி வயர்களுக்குப் பதிலாக, கூறுகளை (components) இணைக்கும் மெல்லிய செம்பு பாதைகள் கொண்ட ஃபைபர்கிளாஸ் (FR-4) தகடு. ஏறக்குறைய எல்லா மின்னணு சாதனங்களிலும் இது உள்ளது."],
 ["The layers","அடுக்குகள் (Layers)",
  "From the outside in: silkscreen (white text), solder mask (the green, blue or black colour), copper (the wiring) and the FR-4 core. Most hobby boards have 2 copper layers; phones and the Raspberry Pi use 6 or more.",
  "வெளியிலிருந்து உள்ளே: silkscreen (வெள்ளை எழுத்து), solder mask (பச்சை, நீலம், கருப்பு நிறம்), செம்பு (வயரிங்), FR-4 உள்ளகம். பெரும்பாலான hobby போர்டுகளில் 2 செம்பு அடுக்குகள்; போன்கள், Raspberry Pi-யில் 6 அல்லது அதற்கு மேல்."],
 ["Traces and vias","Trace-களும் Via-க்களும்",
  "Traces are the copper roads between parts. A via is a small plated hole that carries a trace from one layer to another. Thicker traces carry more current.",
  "Trace-கள் பாகங்களுக்கு இடையே உள்ள செம்புச் சாலைகள். Via என்பது ஒரு அடுக்கிலிருந்து மற்றொரு அடுக்குக்கு trace-ஐக் கொண்டு செல்லும் சிறிய முலாம் பூசிய துளை. தடிமனான trace-கள் அதிக மின்னோட்டத்தைச் சுமக்கும்."],
 ["Through-hole vs SMD","Through-hole மற்றும் SMD",
  "Through-hole parts have legs that go through holes (easy to hand-solder). SMD (surface-mount) parts sit on pads on the surface; they are smaller and are placed by machines.",
  "Through-hole பாகங்களின் கால்கள் துளைகள் வழியாகச் செல்லும் (கையால் சோல்டர் செய்ய எளிது). SMD (surface-mount) பாகங்கள் மேற்பரப்பில் உள்ள பேட்களில் அமரும்; அவை சிறியவை, இயந்திரங்களால் பொருத்தப்படுபவை."],
 ["Pin headers and 2.54 mm pitch","பின் ஹெடர்களும் 2.54 mm இடைவெளியும்",
  "Most hobby pins are 2.54 mm (0.1 inch) apart, the same spacing as a breadboard. Male headers have pins; female headers have sockets.",
  "பெரும்பாலான hobby பின்கள் 2.54 mm (0.1 இன்ச்) இடைவெளியில் இருக்கும்; பிரெட்போர்டின் அதே இடைவெளி. Male ஹெடரில் பின்கள், female ஹெடரில் சாக்கெட்கள்."],
 ["5V vs 3.3V logic","5V மற்றும் 3.3V லாஜிக்",
  "Arduino Uno and Mega use 5V. ESP8266, ESP32, Pico and Raspberry Pi use 3.3V and can be damaged by 5V on their pins. Use a level shifter or a resistor divider between them.",
  "Arduino Uno, Mega 5V பயன்படுத்துகின்றன. ESP8266, ESP32, Pico, Raspberry Pi 3.3V பயன்படுத்துகின்றன; அவற்றின் பின்களில் 5V பட்டால் பழுதாகலாம். இடையே level shifter அல்லது resistor divider பயன்படுத்துங்கள்."],
 ["GPIO, digital, analog and PWM","GPIO, டிஜிட்டல், அனலாக், PWM",
  "GPIO = general purpose input/output. Digital is only ON or OFF. Analog inputs read a range of voltages. PWM switches a pin on and off very fast to act like a variable voltage (LED dimming, motor speed).",
  "GPIO = பொது பயன்பாட்டு உள்ளீடு/வெளியீடு. டிஜிட்டல் என்றால் ON அல்லது OFF மட்டும். அனலாக் உள்ளீடுகள் வோல்டேஜ் வரம்பைப் படிக்கும். PWM ஒரு பின்னை மிக வேகமாக on/off செய்து மாறும் வோல்டேஜ் போல செயல்படும் (LED ஒளி குறைப்பு, மோட்டார் வேகம்)."],
 ["UART, I2C and SPI","UART, I2C, SPI",
  "Three common ways chips talk. UART uses TX and RX (cross them: TX to RX). I2C uses two wires, SDA and SCL, shared by many devices with addresses. SPI uses MOSI, MISO, SCK and one CS pin per device; it is the fastest.",
  "சிப்புகள் பேசும் மூன்று பொதுவான வழிகள். UART: TX, RX (குறுக்காக இணைக்கவும்: TX-ஐ RX-க்கு). I2C: SDA, SCL என்ற இரண்டு வயர்கள்; முகவரிகள் மூலம் பல சாதனங்கள் பகிரும். SPI: MOSI, MISO, SCK, ஒவ்வொரு சாதனத்துக்கும் ஒரு CS பின்; இதுவே வேகமானது."],
 ["Power and common ground","மின்சாரமும் பொது கிரவுண்டும்",
  "Every connected board and module must share GND, otherwise signals have no reference. Add up the current of all parts and make sure your supply can give it with room to spare.",
  "இணைக்கப்பட்ட எல்லா போர்டுகளும் மாட்யூல்களும் GND-ஐப் பகிர வேண்டும்; இல்லையெனில் சிக்னல்களுக்கு அடிப்படை இருக்காது. எல்லாப் பாகங்களின் மின்னோட்டத்தையும் கூட்டி, உங்கள் மின் விநியோகம் கூடுதல் இருப்புடன் அதைத் தர முடியுமா என்று பாருங்கள்."],
 ["Reading the silkscreen","Silkscreen-ஐப் படிப்பது",
  "The white printing names every part: R = resistor, C = capacitor, D = diode, Q = transistor, U = IC, Y or X = crystal, L = inductor, J or P = connector, SW = switch. Pin 1 is marked by a dot, notch or square pad.",
  "வெள்ளை அச்சு ஒவ்வொரு பாகத்தின் பெயரையும் சொல்கிறது: R = ரெசிஸ்டர், C = கெபாசிட்டர், D = டயோடு, Q = டிரான்சிஸ்டர், U = IC, Y அல்லது X = கிரிஸ்டல், L = இண்டக்டர், J அல்லது P = கனெக்டர், SW = ஸ்விட்ச். பின் 1 புள்ளி, வெட்டு அல்லது சதுர பேட் மூலம் குறிக்கப்படும்."],
 ["Multimeter basics","மல்டிமீட்டர் அடிப்படைகள்",
  "Use continuity mode (beep) with power OFF to find shorts and broken wires. Use DC volts with power ON to check 5V and 3.3V rails. Measure current by putting the meter in series, never across the supply.",
  "மின்சாரம் OFF ஆக இருக்கும்போது continuity mode (பீப்) மூலம் short, உடைந்த வயர்களைக் கண்டறியுங்கள். மின்சாரம் ON ஆக இருக்கும்போது DC volts மூலம் 5V, 3.3V-ஐ சரிபாருங்கள். மின்னோட்டத்தை அளக்க மீட்டரை தொடர் இணைப்பில் (series) வையுங்கள்; மின் விநியோகத்துக்குக் குறுக்கே ஒருபோதும் வைக்க வேண்டாம்."],
 ["Soldering and safety","சோல்டரிங்கும் பாதுகாப்பும்",
  "Use a 60W iron at about 330 °C with flux. Heat pad and pin together, then add solder. Touch a metal object before handling boards (static). Never work on 230V wiring while it is plugged in.",
  "சுமார் 330 °C-இல் 60W iron, flux பயன்படுத்துங்கள். பேட், பின் இரண்டையும் சேர்த்து சூடாக்கி, பிறகு சோல்டர் சேருங்கள். போர்டுகளைத் தொடும் முன் ஒரு உலோகப் பொருளைத் தொடுங்கள் (static). 230V வயரிங் இணைப்பில் இருக்கும்போது ஒருபோதும் வேலை செய்ய வேண்டாம்."]
];

/* ---------- SVG RENDERER (pure functions) ---------- */
const f = n => Math.round(n * 100) / 100;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const PIN = "url(#gPin)", SIL = "url(#gSilver)", GOLD = "url(#gGold)";
const R = (x, y, w, h, fill, extra = "") => `<rect x="${f(x)}" y="${f(y)}" width="${f(Math.max(w, 0))}" height="${f(Math.max(h, 0))}" fill="${fill}" ${extra}/>`;
const C = (cx, cy, r, fill, extra = "") => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(Math.max(r, 0))}" fill="${fill}" ${extra}/>`;

function lbl(x, y, w, h, t, col, max) {
  if (!t) return "";
  const lines = String(t).split("|");
  const longest = Math.max(...lines.map(l => l.length));
  const fs = Math.max(3, Math.min(max || 9, h / (lines.length * 1.6), (w * 0.9) / (longest * 0.62)));
  const y0 = y + h / 2 - ((lines.length - 1) * fs * 1.15) / 2;
  return lines.map((l, i) => `<text x="${f(x + w / 2)}" y="${f(y0 + i * fs * 1.15)}" font-size="${f(fs)}" fill="${col}" text-anchor="middle" dominant-baseline="central" class="sl">${esc(l)}</text>`).join("");
}

function hdrPins(c) {
  const o = c.o, p = o.p || 10, n = o.n || 1, r = o.r || 1, v = o.o === "v", out = [];
  for (let j = 0; j < r; j++) for (let i = 0; i < n; i++)
    out.push([c.x + (v ? j * p : i * p) + p / 2, c.y + (v ? i * p : j * p) + p / 2, p]);
  return out;
}

/* port mouth on the outward edge */
function mouth(x, y, w, h, e, fill, depth, span) {
  depth = depth || 0.28; span = span || 0.62;
  if (e === "l") return R(x, y + h * (1 - span) / 2, w * depth, h * span, fill);
  if (e === "r") return R(x + w * (1 - depth), y + h * (1 - span) / 2, w * depth, h * span, fill);
  if (e === "t") return R(x + w * (1 - span) / 2, y, w * span, h * depth, fill);
  return R(x + w * (1 - span) / 2, y + h * (1 - depth), w * span, h * depth, fill);
}

function drawComp(c) {
  const { t, x, y, w, h, lb, o } = c;
  let s = "";
  const e = o.e || "l";
  switch (t) {
    case "chip": {
      const pm = o.pins || "q", dip = o.dip;
      const pp = dip ? 10 : Math.max(2.4, Math.min(4.2, Math.min(w, h) / 7));
      const pl = dip ? 4.5 : Math.max(1.8, Math.min(3.2, Math.min(w, h) * 0.11));
      const pw = dip ? 3.4 : pp * 0.5;
      if (pm === "q" || pm === "tb") {
        const n = Math.max(1, Math.floor((w - pp * 0.8) / pp)), off = x + (w - (n - 1) * pp) / 2;
        for (let i = 0; i < n; i++) { const cx = off + i * pp; s += R(cx - pw / 2, y - pl, pw, pl, PIN) + R(cx - pw / 2, y + h, pw, pl, PIN); }
      }
      if (pm === "q" || pm === "lr") {
        const n = Math.max(1, Math.floor((h - pp * 0.8) / pp)), off = y + (h - (n - 1) * pp) / 2;
        for (let i = 0; i < n; i++) { const cy = off + i * pp; s += R(x - pl, cy - pw / 2, pl, pw, PIN) + R(x + w, cy - pw / 2, pl, pw, PIN); }
      }
      s += R(x, y, w, h, o.col || "url(#gChip)", `rx="1.4" stroke="#000" stroke-width=".6"`);
      if (dip) s += `<path d="M${f(x)} ${f(y + h / 2 - 4)} a4 4 0 0 1 0 8" fill="#2b2d31"/>`;
      else s += C(x + Math.min(3.5, w * 0.16), y + Math.min(3.5, h * 0.16), Math.min(1.4, w * 0.06), "#3b3e44");
      s += lbl(x, y, w, h, lb, "#c3c7cd", dip ? 9 : 7.5);
      break;
    }
    case "shield":
      s += R(x, y, w, h, SIL, `rx="1.8" stroke="#80868d" stroke-width=".8"`);
      s += R(x + 2.5, y + 2.5, w - 5, h - 5, "none", `rx="1" stroke="#a1a7ad" stroke-width=".5"`);
      s += lbl(x, y, w, h, lb, "#3a3f46", 9);
      break;
    case "antenna": {
      s += R(x, y, w, h, "rgba(0,0,0,.12)", `rx="1"`);
      const horiz = w >= h, L = horiz ? w : h, n = Math.max(3, Math.floor(L / 6.5)), st = L / n;
      let d = "";
      if (horiz) {
        let px = x + st / 2; d = `M${f(px)} ${f(y + h - 3)}`;
        for (let i = 0; i < n; i++) { const ty = i % 2 === 0 ? y + 3 : y + h - 3; d += ` L${f(px)} ${f(ty)}`; if (i < n - 1) { px += st; d += ` L${f(px)} ${f(ty)}`; } }
      } else {
        let py = y + st / 2; d = `M${f(x + 3)} ${f(py)}`;
        for (let i = 0; i < n; i++) { const tx = i % 2 === 0 ? x + w - 3 : x + 3; d += ` L${f(tx)} ${f(py)}`; if (i < n - 1) { py += st; d += ` L${f(tx)} ${f(py)}`; } }
      }

      s += R(x + w * 0.25, y + h * 0.25, w * 0.5, h * 0.5, "none", `stroke="#a3a9b0" stroke-width=".6"`);
      break;
    case "usba":
      s += R(x, y, w, h, SIL, `rx="1.5" stroke="#7c838a" stroke-width=".8"`);
      s += mouth(x, y, w, h, e, "#2a2d31", 0.12, 0.84);
      s += mouth(x, y, w, h, e, o.col || "#222", 0.06, 0.5);

    case "eth":
      s += R(x, y, w, h, SIL, `rx="1.5" stroke="#7c838a" stroke-width=".8"`);
      s += mouth(x, y, w, h, e, "#24272b", 0.14, 0.62);
      if (e === "r") { s += R(x + w - 6, y + 3, 5, 6, "#38d16a") + R(x + w - 6, y + h - 9, 5, 6, "#ffb000"); }
      else { s += R(x + 1, y + 3, 5, 6, "#38d16a") + R(x + 1, y + h - 9, 5, 6, "#ffb000"); }
      break;
    case "hdmi":
      s += R(x, y, w, h, SIL, `rx="1.2" stroke="#7c838a" stroke-width=".8"`);
      s += mouth(x, y, w, h, e, "#24272b", 0.22, 0.66);
      s += lbl(x, y + h * 0.15, w, h * 0.45, lb ? "HDMI" + lb : "HDMI", "#4a5058", 5);
      break;
    case "jack":
      s += R(x, y, w, h, "#18191b", `rx="2" stroke="#000" stroke-width=".8"`);
      s += C(e === "l" ? x + w * 0.22 : x + w * 0.78, y + h / 2, h * 0.3, "#050505", `stroke="#3a3a3a" stroke-width="1"`);
      s += C(e === "l" ? x + w * 0.22 : x + w * 0.78, y + h / 2, h * 0.08, "#9aa0a6");
      break;
    case "audio":
      s += R(x, y, w, h, "#18191b", `rx="2" stroke="#000" stroke-width=".8"`);
      s += C(x + w / 2, e === "b" ? y + h * 0.78 : y + h * 0.22, w * 0.28, "#050505", `stroke="#3a3a3a"`);
      break;
    case "header": case "jhdr": {
      const pins = hdrPins(c);
      s += R(x, y, w, h, o.f ? "#151515" : "#1d1d1f", `rx="1"`);
      pins.forEach(([cx, cy, p]) => {
        if (o.f) s += R(cx - p * 0.22, cy - p * 0.22, p * 0.44, p * 0.44, "#000", `stroke="#4a4436" stroke-width=".6"`);
        else s += R(cx - p * 0.19, cy - p * 0.19, p * 0.38, p * 0.38, GOLD, `stroke="#7d5f1d" stroke-width=".4"`);
      });
      if (t === "jhdr") {
        const p = o.p || 10, r = o.r || 1, caps = o.cap || 2;
        for (let j = 0; j < r; j++) s += R(x + 0.8, y + j * p + 0.8, caps * p - 1.6, p - 1.6, "#1b1b1d", `rx="1.2" stroke="#55585e" stroke-width=".6"`);
      }

    }
    case "pads":
      hdrPins(c).forEach(([cx, cy, p]) => { s += C(cx, cy, p * 0.37, GOLD, `stroke="#8a6a22" stroke-width=".4"`) + C(cx, cy, p * 0.16, "rgba(0,0,0,.55)"); });
      break;
    case "crystal":
      if (o.smd) { s += R(x, y, w, h, SIL, `rx="1" stroke="#80868d" stroke-width=".6"`); s += lbl(x, y, w, h, lb, "#3a3f46", 5); }
      else { s += R(x, y, w, h, SIL, `rx="${h / 2}" stroke="#7c838a" stroke-width=".8"`); s += lbl(x, y, w, h, lb, "#3a3f46", 6); }

      s += C(x + w / 2, y + h / 2, Math.min(w, h) * 0.3, o.col || "#121212", `stroke="#555" stroke-width=".8"`);
      if (lb && Math.min(w, h) >= 16) s += lbl(x, y + h * 0.8, w, h * 0.22, lb, "#e9ecef", 3.6);

    case "led":

    case "leds": {

    case "usbfinger":
      s += R(x, y, w, h, "rgba(0,0,0,.18)", `rx="1"`);

    case "rled": {
      const r = Math.min(w, h) / 2, cx = x + w / 2, cy = y + h / 2;

    }

      s += R(x, y, w, h, "#333");

  return s;
}

/* through-hole solder joints seen from the back */
function backSolder(c) {
  let s = "";
  if (["header", "pads", "jhdr"].includes(c.t)) {
    hdrPins(c).forEach(([cx, cy, p]) => { s += C(cx, cy, p * 0.36, GOLD) + C(cx, cy, p * 0.24, "url(#gSolder)"); });
  } else if (["usbb", "jack", "relay", "term", "cap", "usba", "eth", "to220", "usonic", "audio", "heatsink", "dht", "dome", "jst", "coin", "rled", "lcd", "seg", "matrix"].includes(c.t)) {
    const k = 5, pts = [[c.x + k, c.y + k], [c.x + c.w - k, c.y + k], [c.x + k, c.y + c.h - k], [c.x + c.w - k, c.y + c.h - k]];
    pts.forEach(([a, b]) => { s += C(a, b, 3.4, GOLD) + C(a, b, 2.3, "url(#gSolder)"); });
  } else if (c.t === "crystal" && !c.o.smd) {
    s += C(c.x + c.w * 0.3, c.y + c.h / 2, 2.6, GOLD) + C(c.x + c.w * 0.7, c.y + c.h / 2, 2.6, GOLD);
  } else if (c.t === "chip" && c.o.dip) {
    hdrPins({ x: c.x + 5, y: c.y - 5, o: { n: Math.floor(c.w / 10), p: 10 } }).forEach(([a, b]) => { s += C(a, b, 2.6, GOLD) + C(a, b + c.h + 10, 2.6, GOLD); });
  }
  return s;
}

function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = seed || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

function traces(b) {
  const r = rng(hash(b.id)), W = b.W, H = b.bh || b.H;
  let s = "";
  const n = Math.round(Math.min(26, 6 + (W * H) / 3200));
  for (let i = 0; i < n; i++) {
    let x = 8 + r() * (W - 16), y = 8 + r() * (H - 16);
    let d = `M${f(x)} ${f(y)}`;
    for (let k = 0; k < 3; k++) {
      const len = 8 + r() * 42, dir = Math.floor(r() * 6);

let drag = null, suppress = false;
function bindStage() {
  const st = $("#stage");
  st.addEventListener("pointerdown", e => {
    if (e.button !== undefined && e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, tx: S.tx, ty: S.ty, id: e.pointerId, moved: false };
  });
  st.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 6) {
      drag.moved = true; $("#b3d").classList.add("noanim"); st.classList.add("dragging");
      try { st.setPointerCapture(e.pointerId); } catch (_) { }
    }
    if (drag.moved) {
      S.ty = drag.ty + dx * 0.5;
      if (e.pointerType === "mouse") S.tx = Math.max(-70, Math.min(70, drag.tx - dy * 0.4));
      applyT(false);
    }
  });
  const end = e => {
    if (!drag) return;
    if (drag.moved) { suppress = true; setTimeout(() => { suppress = false; }, 50); $("#b3d").classList.remove("noanim"); st.classList.remove("dragging"); }
    drag = null;
  };
  st.addEventListener("pointerup", end);
  st.addEventListener("pointercancel", end);
  st.addEventListener("click", e => {
    if (suppress) return;
    const g = e.target.closest(".hs"); if (g) select(+g.dataset.i, false);
  });
}

function select(i, fromList) {

  $$(".pbtn").forEach(x => x.setAttribute("aria-current", +x.dataset.i === i ? "true" : "false"));
  renderDetail();
  const d = $("#detail");

/* ---------- speech ---------- */
function speak() {
  try {
    const synth = window.speechSynthesis; if (!synth) return;
    if (synth.speaking) { synth.cancel(); return; }
    const b = findB(S.board), c = b.cs[S.sel], p = P[c.p];
    const parts = [];
    const add = (o) => { if (LANG !== "ta") parts.push([en(o), "en-IN"]); if (LANG !== "en") parts.push([ta(o), "ta-IN"]); };
    [p.n, c.ne ? [c.ne, c.nt] : null, p.w, p.d, p.t].forEach(o => { if (o) add(o); });
    const voices = synth.getVoices();
    parts.forEach(([text, lang]) => {
      const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = 0.95;
      const v = voices.find(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(lang.slice(0, 2).toLowerCase()));
      if (v) u.voice = v;
      synth.speak(u);
    });
  } catch (e) { }
}

      ${(i.photos || []).length > 1 ? `<span class="ws-count">${i.photos.length} 📷</span>` : ""}</div>
    <div class="ws-body">
      <div class="ws-top"><h3>${esc(i.name || (b ? b.n : "Board"))}</h3><span class="ws-qty">${i.qty}×</span></div>
      <p class="ws-meta"><span class="st" style="--st:${ST[i.status][1]}">${one(UI[ST[i.status][0]])}</span>${i.location ? ` · 📦 ${esc(i.location)}` : ""}</p>
      ${i.project ? `<p class="ws-line"><span>${one(UI.project)}:</span> ${esc(i.project)}</p>` : ""}
      ${i.bought || i.price != null ? `<p class="ws-line">${i.bought ? `${one(UI.bought)}: ${esc(i.bought)}` : ""}${i.bought && i.price != null ? " · " : ""}${i.price != null ? `AED ${Number(i.price).toFixed(2)}` : ""}</p>` : ""}
      ${i.notes ? `<p class="ws-notes">${esc(i.notes)}</p>` : ""}
      ${(i.photos || []).length > 1 ? `<div class="ws-thumbs">${i.photos.slice(1).map(p => `<img src="${photoURL(p)}" alt="" loading="lazy" data-box="${esc(p)}">`).join("")}</div>` : ""}
      <div class="ws-foot">${b ? `<a href="#b-${b.id}">${one(UI.learn)} →</a>` : "<span></span>"}
        ${unlocked ? (WS.confirmDel === i.id
          ? `<span class="ws-confirm">${one(UI.sure)} <button type="button" class="cb danger" data-ws="delyes" data-id="${i.id}">${one(UI.yes)}</button><button type="button" class="cb" data-ws="delno">${one(UI.cancel)}</button></span>`
          : `<span><button type="button" class="cb" data-ws="edit" data-id="${i.id}">${one(UI.edit)}</button><button type="button" class="cb" data-ws="del" data-id="${i.id}">${one(UI.del)}</button></span>`) : ""}
      </div>
    </div></article>`;
}

function formHTML() {
  const it = WS.edit === "new" ? { board: "", name: "", qty: 1, status: "stock", location: "", bought: "", price: null, project: "", notes: "", photos: [] } : WS.items.find(x => x.id === WS.edit);
  if (!it) return "";
  WS.keep = WS.keep || [...(it.photos || [])];
  const opts = Object.keys(CATS).map(c => `<optgroup label="${esc(one(CATS[c]))}">${BOARDS.filter(b => b.cat === c).map(b => `<option value="${b.id}"${it.board === b.id ? " selected" : ""}>${esc(b.n)}</option>`).join("")}</optgroup>`).join("");
  const sel = (k) => it.status === k ? " selected" : "";
  return `<form class="ws-form" id="wsform">
    <h2 class="sec">${one(WS.edit === "new" ? UI.add : UI.edit)}</h2>
    <div class="fgrid">
      <label class="f2">${one(UI.board)}<select id="f-board" name="board"><option value="other"${it.board === "other" ? " selected" : ""}>${one(UI.other)}</option>${opts}</select></label>
      <label class="f2">${one(UI.name)}<input id="f-name" name="name" maxlength="80" value="${esc(it.name)}" placeholder="NodeMCU V3 (CH340)"></label>
      <label>${one(UI.qty)}<input id="f-qty" name="qty" type="number" min="0" max="9999" step="1" value="${it.qty}"></label>
      <label>${one(UI.status)}<select id="f-status" name="status"><option value="stock"${sel("stock")}>${one(UI.inStock)}</option><option value="use"${sel("use")}>${one(UI.inUse)}</option><option value="used"${sel("used")}>${one(UI.usedUp)}</option><option value="faulty"${sel("faulty")}>${one(UI.faulty)}</option></select></label>
      <label>${one(UI.loc)}<input id="f-loc" name="location" maxlength="80" value="${esc(it.location)}" placeholder="Box A · drawer 2"></label>
      <label>${one(UI.bought)}<input id="f-bought" name="bought" type="date" value="${esc(it.bought)}"></label>
      <label>${one(UI.price)}<input id="f-price" name="price" type="number" min="0" step="0.01" value="${it.price == null ? "" : it.price}"></label>
      <label>${one(UI.project)}<input id="f-proj" name="project" maxlength="120" value="${esc(it.project)}" placeholder="Water tank level meter"></label>
      <label class="f4">${one(UI.notes)}<textarea id="f-notes" name="notes" rows="3" maxlength="1500">${esc(it.notes)}</textarea></label>
      <div class="f4"><span class="flabel">${one(UI.photos)}</span>
        <div class="ph-row">${WS.keep.map(p => `<span class="ph"><img src="${photoURL(p)}" alt=""><button type="button" data-ws="rmphoto" data-p="${esc(p)}" aria-label="Remove photo">×</button></span>`).join("")}
          ${(WS.newFiles || []).map((f, k) => `<span class="ph"><img src="${f.url}" alt=""><button type="button" data-ws="rmnew" data-k="${k}" aria-label="Remove photo">×</button></span>`).join("")}
          ${(WS.keep.length + (WS.newFiles || []).length) < 6 ? `<label class="ph add">＋📷<input id="f-photos" type="file" accept="image/*" multiple hidden></label>` : ""}</div></div>
    </div>
    ${WS.err ? `<p class="ws-err">${esc(WS.err)}</p>` : ""}
    <div class="crow"><button type="submit" class="cb wide accent"${WS.busy ? " disabled" : ""}>${one(WS.busy ? UI.saving : UI.save)}</button><button type="button" class="cb wide" data-ws="cancel">${one(UI.cancel)}</button></div>
  </form>`;
}

/* shrink photos in the browser before upload (max 1600 px, JPEG) */
function shrink(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const m = 1600, k = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b ? { blob: b, url: URL.createObjectURL(b) } : null); }, "image/jpeg", 0.84);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

function keepFormValues() {
  const f = $("#wsform"); if (!f) return null;
  const v = {}; ["board", "name", "qty", "status", "location", "bought", "price", "project", "notes"].forEach(k => { v[k] = f.elements[k].value; });
  return v;
}
function restoreFormValues(v) {
  const f = $("#wsform"); if (!f || !v) return;
  Object.keys(v).forEach(k => { if (f.elements[k]) f.elements[k].value = v[k]; });
}
function rerenderForm() { const v = keepFormValues(); renderWorkshop(); restoreFormValues(v); }

async function api(method, url, body) {
  const r = await fetch(url, { method, body, headers: { "x-workshop-pin": WS.pin } });
  let d = {}; try { d = await r.json(); } catch (e) { }
  if (r.status === 401) { WS.pin = ""; store.set("pin", ""); }
  if (!r.ok) throw new Error(d.error || "Request failed (" + r.status + ")");
  return d;
}

async function saveForm() {
  const v = keepFormValues(); if (!v) return;
  if (v.board === "other" && !v.name.trim()) { WS.err = LANG === "ta" ? "வேறு போர்டுக்கு பெயர் தேவை." : "Give the board a name when you choose Other."; rerenderForm(); return; }
  if (!v.name.trim()) { const b = findB(v.board); if (b) v.name = b.n; }
  const fd = new FormData();
  Object.keys(v).forEach(k => fd.append(k, v[k]));
  fd.append("keep", JSON.stringify(WS.keep || []));
  (WS.newFiles || []).forEach((f, k) => fd.append("photos", f.blob, "photo" + k + ".jpg"));
  WS.busy = true; WS.err = ""; rerenderForm();
  try {
    if (WS.edit === "new") await api("POST", "/api/workshop", fd);
    else await api("PUT", "/api/workshop/" + encodeURIComponent(WS.edit), fd);
    closeForm(); await wsLoad();
  } catch (e) { WS.busy = false; WS.err = e.message; rerenderForm(); if (!WS.pin) { closeForm(); WS.askPin = true; WS.err = e.message; renderWorkshop(); } }
}
function closeForm() { (WS.newFiles || []).forEach(f => URL.revokeObjectURL(f.url)); Object.assign(WS, { edit: null, keep: null, newFiles: [], busy: false, err: "" }); }

/* lightbox */
function openBox(p) {
  let el = $("#lbox");
  if (!el) { el = document.createElement("div"); el.id = "lbox"; el.className = "lbox"; document.body.appendChild(el); }
  el.innerHTML = `<button type="button" class="lb-x" aria-label="Close">×</button><img src="${photoURL(p)}" alt="">`;
  el.hidden = false;
}

document.addEventListener("click", async e => {
  const img = e.target.closest("[data-box]");
  if (img && img.tagName === "IMG") { openBox(img.dataset.box); return; }
  if (e.target.closest(".lbox")) { $("#lbox").hidden = true; return; }
  const f = e.target.closest("[data-wsf]");
  if (f) { WS.filter = f.dataset.wsf; renderWorkshop(); return; }
  const b = e.target.closest("[data-ws]"); if (!b) return;
  const a = b.dataset.ws;
  if (a === "askpin") { WS.askPin = true; WS.err = ""; renderWorkshop(); }
  if (a === "lock") { WS.pin = ""; store.set("pin", ""); closeForm(); renderWorkshop(); }
  if (a === "add") { closeForm(); WS.edit = "new"; renderWorkshop(); window.scrollTo({ top: 0 }); }
  if (a === "edit") { closeForm(); WS.edit = b.dataset.id; renderWorkshop(); window.scrollTo({ top: 0 }); }
  if (a === "cancel") { closeForm(); renderWorkshop(); }
  if (a === "del") { WS.confirmDel = b.dataset.id; renderWorkshop(); }
  if (a === "delno") { WS.confirmDel = null; renderWorkshop(); }
  if (a === "delyes") {
    try { await api("DELETE", "/api/workshop/" + encodeURIComponent(b.dataset.id)); WS.confirmDel = null; await wsLoad(); }
    catch (err) { WS.confirmDel = null; WS.err = err.message; WS.askPin = !WS.pin; renderWorkshop(); }
  }
  if (a === "rmphoto") { WS.keep = WS.keep.filter(p => p !== b.dataset.p); rerenderForm(); }
  if (a === "rmnew") { const k = +b.dataset.k; URL.revokeObjectURL(WS.newFiles[k].url); WS.newFiles.splice(k, 1); rerenderForm(); }
});
document.addEventListener("change", async e => {
  if (e.target.id === "f-photos") {
    const files = Array.from(e.target.files || []).slice(0, 6 - (WS.keep || []).length - (WS.newFiles || []).length);
    const out = (await Promise.all(files.map(shrink))).filter(Boolean);
    WS.newFiles = (WS.newFiles || []).concat(out); rerenderForm();
  }
  if (e.target.id === "f-board") {
    const n = $("#f-name"), bb = findB(e.target.value);
    if (n && bb && !n.value.trim()) n.value = bb.n;
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id === "pinform") {
    e.preventDefault();
    const pin = $("#pin").value;
    try {
      const r = await fetch("/api/workshop/unlock", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Wrong PIN.");
      WS.pin = pin; store.set("pin", pin); WS.askPin = false; WS.err = ""; renderWorkshop();
    } catch (err) { WS.err = err.message; renderWorkshop(); }
  }
  if (e.target.id === "wsform") { e.preventDefault(); if (!WS.busy) saveForm(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#lbox") && !$("#lbox").hidden) $("#lbox").hidden = true; });

route();
wsLoad();
</script>
</body></html>
