  else { S.openPart = id; go("parts"); }
}

/* ---------- routing ---------- */
function go(hash) { if (location.hash.slice(1) === hash) route(); else location.hash = hash; }
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("b-") && findB(h.slice(2))) {
    const id = h.slice(2);
    if (S.board !== id) Object.assign(S, { board: id, sel: null, rz: 0, tx: 0, ty: 0, flip: false, zoom: 1 });
    S.view = "board"; store.set("last", id);
  } else if (h === "parts") S.view = "parts";
  else if (h === "basics") S.view = "basics";
  else S.view = "lib";
  render();
  window.scrollTo(0, 0);
}
function render() {
  renderChrome();
  ["lib", "board", "parts", "basics"].forEach(v => { $("#v-" + v).hidden = S.view !== v; });
  if (S.view === "lib") renderLib();
  if (S.view === "board") renderBoard();
  if (S.view === "parts") renderParts();
  if (S.view === "basics") renderBasics();
}

/* ---------- library ---------- */
function renderLib() {
  const q = S.q.trim();
  const hits = q ? new Set(searchAll(q).filter(r => r.type === "b").map(r => r.id)) : null;
  const list = BOARDS.filter(b => (S.cat === "all" || b.cat === S.cat) && (!hits || hits.has(b.id)));
  const cats = ["all", ...Object.keys(CATS)];
  $("#v-lib").innerHTML = `
    <div class="pagehead"><h1>${tx(UI.libTitle)}</h1><p class="lede">${tx(UI.libSub)}</p></div>
    <div class="chips" role="tablist">${cats.map(c => {
      const cnt = c === "all" ? BOARDS.length : BOARDS.filter(b => b.cat === c).length;
      return `<button type="button" class="chip" data-cat="${c}" aria-pressed="${S.cat === c}">${one(c === "all" ? UI.all : CATS[c])}<span class="cnt">${cnt}</span></button>`;
    }).join("")}</div>
    ${list.length ? `<div class="grid">${list.map(b => `
      <a class="card" href="#b-${b.id}">
        <div class="thumb">${boardSVG(b, "front", false)}</div>
        <div class="card-b">
          <p class="eyebrow">${one(CATS[b.cat])}</p>
          <h3>${esc(b.n)}</h3>
          <p class="meta"><code>${esc(b.chip)}</code> · ${esc(b.volt)}</p>
          <p class="card-use">${tx(b.uses[0])}</p>
          <p class="pts">${b.c.length} ${LANG === "ta" ? "பகுதிகள்" : "points"}</p>
        </div>
      </a>`).join("")}</div>` : `<p class="empty">${tx(UI.noRes)}</p>`}`;
}

/* ---------- board view ---------- */
function renderBoard() {
  const b = normBoard(findB(S.board));
  const pts = b.cs;
  $("#v-board").innerHTML = `
    <div class="bhead">
      <a class="backlink" href="#">← ${one(UI.back)}</a>
      <p class="eyebrow">${one(CATS[b.cat])}</p>
      <h1>${esc(b.n)}</h1>
      <p class="meta"><code>${esc(b.chip)}</code> · ${esc(b.volt)} · ${pts.length} ${LANG === "ta" ? "பகுதிகள்" : "points"}</p>
    </div>
    <div class="bv">
      <div class="colA">
        <div class="stagebox">
          <div class="stage" id="stage" aria-label="${esc(b.n)} interactive board">
            <div class="b3d" id="b3d">
              <div class="face front">${boardSVG(b, "front", true)}</div>
              <div class="face back">${boardSVG(b, "back", true)}</div>
            </div>
            <div class="sidetag" id="sidetag"></div>
            <div class="scalebar" id="scalebar"><span></span><b>10 mm</b></div>
            <div class="angle" id="angle"></div>
          </div>
          <div class="ctrls">
            <div class="crow">
              <button type="button" class="cb" data-act="rl" title="Rotate left 90°" aria-label="Rotate left">⟲</button>
              <input type="range" id="rot" min="0" max="359" step="1" value="${S.rz}" aria-label="Rotate">
              <button type="button" class="cb" data-act="rr" title="Rotate right 90°" aria-label="Rotate right">⟳</button>
            </div>
            <div class="crow wrap">
              <button type="button" class="cb wide" data-act="flip" aria-pressed="${S.flip}">⇋ ${LANG === "ta" ? "திருப்பு" : "Flip"}</button>
              <button type="button" class="cb wide" data-act="tilt" aria-pressed="${S.tilt}">◩ 3D</button>
              <button type="button" class="cb" data-act="zo" aria-label="Zoom out">−</button>
              <button type="button" class="cb" data-act="zi" aria-label="Zoom in">+</button>
              <button type="button" class="cb wide" data-act="nums" aria-pressed="${S.nums}"># ${LANG === "ta" ? "எண்கள்" : "Numbers"}</button>
              <button type="button" class="cb wide" data-act="reset">↺ ${LANG === "ta" ? "மீட்டமை" : "Reset"}</button>
            </div>
            <p class="hint">${tx(UI.drag)}</p>
          </div>
        </div>
        <section class="points">
          <h2 class="sec">${tx(UI.points)}</h2>
          <ol class="plist">${pts.map(c => `<li><button type="button" class="pbtn" data-i="${c.i}">
             <span class="pn">${c.i + 1}</span>
             <span class="pt">${tx(partName(c))}${c.lb ? `<code>${esc(c.lb.replace(/\|/g, " "))}</code>` : ""}</span>
             ${c.back ? `<span class="bk">${one(UI.backSide)}</span>` : ""}</button></li>`).join("")}</ol>
        </section>
      </div>
      <div class="colB">
        <section class="detail" id="detail" aria-live="polite"></section>
        <section class="over">
          <h2 class="sec">${tx(UI.about)}</h2>
          <p class="prose">${tx(b.ab)}</p>
          <h2 class="sec">${tx(UI.specs)}</h2>
          <table class="specs"><tbody>${b.sp.map(([k, v]) => `<tr><th>${tx(SK[k] || [k, k])}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>
          <h2 class="sec">${tx(UI.uses)}</h2>
          <ul class="uses">${b.uses.map(u => `<li>${tx(u)}</li>`).join("")}</ul>
          <div class="tipbox"><h3>${tx(UI.tip)}</h3><p>${tx(b.tip)}</p></div>
        </section>
      </div>
    </div>`;
  $("#b3d").classList.toggle("nonum", !S.nums);
  bindStage();
  renderDetail();
  applyT(true);
}

function visibleBack() { const a = (((S.ty + (S.flip ? 180 : 0)) % 360) + 360) % 360; return a > 90 && a < 270; }

let fitScale = 1;
function applyT(instant) {
  const b = findB(S.board), st = $("#stage"), el = $("#b3d"); if (!st || !el) return;
  const VW = b.W + PAD * 2, VH = b.H + PAD * 2, a = S.rz * Math.PI / 180;
  const fw = Math.abs(VW * Math.cos(a)) + Math.abs(VH * Math.sin(a)), fh = Math.abs(VW * Math.sin(a)) + Math.abs(VH * Math.cos(a));
  const sw = st.clientWidth, sh = st.clientHeight;
  fitScale = Math.min(sw * 0.92 / fw, sh * 0.86 / fh);
  const w = VW * fitScale, h = VH * fitScale;
  if (instant) el.classList.add("noanim");
  el.style.width = w + "px"; el.style.height = h + "px";
  el.style.left = (sw - w) / 2 + "px"; el.style.top = (sh - h) / 2 + "px";
  const tiltX = S.tilt ? 38 : 0;
  el.style.transform = `rotateX(${S.tx + tiltX}deg) rotateY(${S.ty + (S.flip ? 180 : 0)}deg) rotateZ(${S.rz}deg) scale(${S.zoom})`;
  if (instant) { void el.offsetWidth; el.classList.remove("noanim"); }
  $("#sidetag").innerHTML = one(visibleBack() ? UI.backSide : UI.front);
  const bar = $("#scalebar span"); if (bar) bar.style.width = (40 * fitScale * S.zoom) + "px";
  $("#angle").textContent = `${Math.round(S.rz)}°`;
  const r = $("#rot"); if (r) r.value = Math.round(S.rz);
  $$(".cb[data-act=flip]").forEach(x => x.setAttribute("aria-pressed", S.flip));
  $$(".cb[data-act=tilt]").forEach(x => x.setAttribute("aria-pressed", S.tilt));
}

let drag = null, suppress = false;
function bindStage() {
  const st = $("#stage");
  st.addEventListener("pointerdown", e => {
    if (e.button !== undefined && e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, tx: S.tx, ty: S.ty, id: e.pointerId, moved: false };
  });
  st.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 6) {
      drag.moved = true; $("#b3d").classList.add("noanim"); st.classList.add("dragging");
      try { st.setPointerCapture(e.pointerId); } catch (_) { }
    }
    if (drag.moved) {
      S.ty = drag.ty + dx * 0.5;
      if (e.pointerType === "mouse") S.tx = Math.max(-70, Math.min(70, drag.tx - dy * 0.4));
      applyT(false);
    }
  });
  const end = e => {
    if (!drag) return;
    if (drag.moved) { suppress = true; setTimeout(() => { suppress = false; }, 50); $("#b3d").classList.remove("noanim"); st.classList.remove("dragging"); }
    drag = null;
  };
  st.addEventListener("pointerup", end);
  st.addEventListener("pointercancel", end);
  st.addEventListener("click", e => {
    if (suppress) return;
    const g = e.target.closest(".hs"); if (g) select(+g.dataset.i, false);
  });
}

function select(i, fromList) {
  const b = findB(S.board); if (!b) return;
  const c = b.cs[i];
  S.sel = i;
  if (c.back !== visibleBack()) S.flip = !S.flip;
  applyT(false);
  $$(".hs").forEach(g => g.classList.toggle("on", +g.dataset.i === i));
  $$(".pbtn").forEach(x => x.setAttribute("aria-current", +x.dataset.i === i ? "true" : "false"));
  renderDetail();
  const d = $("#detail");
  if (d) {
    const r = d.getBoundingClientRect();
    const target = fromList ? $("#stage") : d;
    const tr = target.getBoundingClientRect();
    if (tr.top < 0 || tr.bottom > window.innerHeight) target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: fromList ? "start" : "nearest" });
  }
}

function renderDetail() {
  const d = $("#detail"), b = findB(S.board); if (!d) return;
  if (S.sel == null) {
    d.innerHTML = `<div class="d-empty"><span class="d-ico">☝</span><p>${tx(UI.tap)}</p></div>`;
    return;
  }
  const c = b.cs[S.sel], p = P[c.p], n = b.cs.length;
  const row = (k, val) => val ? `<div class="drow"><h3>${tx(UI[k])}</h3><p>${tx(val)}</p></div>` : "";
  d.innerHTML = `
    <div class="d-top">
      <span class="d-num">${S.sel + 1}</span>
      <div class="d-title"><h2>${tx(p.n)}</h2>
        <p>${c.lb ? `<code>${esc(c.lb.replace(/\|/g, " "))}</code>` : ""}${c.back ? `<span class="bk">${one(UI.backSide)}</span>` : ""}</p></div>
      <div class="d-icon">${partIcon(c.p)}</div>
    </div>
    ${c.ne ? row("here", [c.ne, c.nt]) : ""}
    ${row("what", p.w)}${row("does", p.d)}${row("test", p.t)}
    <div class="d-nav">
      <button type="button" class="cb wide" data-nav="-1">← ${LANG === "ta" ? "முந்தைய" : "Previous"}</button>
      <span class="d-count">${S.sel + 1} / ${n}</span>
      <button type="button" class="cb wide" data-nav="1">${LANG === "ta" ? "அடுத்தது" : "Next"} →</button>
      ${"speechSynthesis" in window ? `<button type="button" class="cb wide listen" data-act="speak" title="${esc(en(TA_FONT_NOTE))}">🔊 ${LANG === "ta" ? "கேளுங்கள்" : "Listen"}</button>` : ""}
    </div>`;
}

/* ---------- speech ---------- */
function speak() {
  try {
    const synth = window.speechSynthesis; if (!synth) return;
    if (synth.speaking) { synth.cancel(); return; }
    const b = findB(S.board), c = b.cs[S.sel], p = P[c.p];
    const parts = [];
    const add = (o) => { if (LANG !== "ta") parts.push([en(o), "en-IN"]); if (LANG !== "en") parts.push([ta(o), "ta-IN"]); };
    [p.n, c.ne ? [c.ne, c.nt] : null, p.w, p.d, p.t].forEach(o => { if (o) add(o); });
    const voices = synth.getVoices();
    parts.forEach(([text, lang]) => {
      const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = 0.95;
      const v = voices.find(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(lang.slice(0, 2).toLowerCase()));
      if (v) u.voice = v;
      synth.speak(u);
    });
  } catch (e) { }
}

/* ---------- parts view ---------- */
function renderParts() {
  const q = norm(S.q.trim());
  const usedOn = {};
  BOARDS.forEach(b => b.c.forEach(a => { (usedOn[a[0]] = usedOn[a[0]] || new Set()).add(b.id); }));
  const list = Object.values(P).filter(p => !q || norm(p.n[0] + p.n[1] + p.k + p.w[0]).includes(q)).sort((a, b) => en(a.n).localeCompare(en(b.n)));
  $("#v-parts").innerHTML = `
    <div class="pagehead"><h1>${tx(UI.partsTitle)}</h1><p class="lede">${tx(UI.partsSub)}</p></div>
    ${list.length ? `<div class="pgrid">${list.map(p => {
      const on = [...(usedOn[p.k] || [])];
      return `<details class="pcard" id="p-${p.k}"${S.openPart === p.k ? " open" : ""}>
        <summary><div class="picon">${partIcon(p.k)}</div><div class="pc-t"><h3>${tx(p.n)}</h3><p>${tx(p.w)}</p></div></summary>
        <div class="pc-more">
          <div class="drow"><h3>${tx(UI.does)}</h3><p>${tx(p.d)}</p></div>
          <div class="drow"><h3>${tx(UI.test)}</h3><p>${tx(p.t)}</p></div>
          ${on.length ? `<div class="drow"><h3>${tx(UI.foundOn)}</h3><p class="links">${on.map(id => `<a href="#b-${id}">${esc(findB(id).n)}</a>`).join("")}</p></div>` : ""}
        </div></details>`;
    }).join("")}</div>` : `<p class="empty">${tx(UI.noRes)}</p>`}`;
  if (S.openPart) {
    const el = $("#p-" + S.openPart);
    if (el) setTimeout(() => el.scrollIntoView({ block: "center" }), 30);
    S.openPart = null;
  }
}

/* ---------- basics view ---------- */
function layerSVG() {
  const L = [["Silkscreen", "சில்க்ஸ்கிரீன்", "var(--silk-l)", 6], ["Solder mask", "சோல்டர் மாஸ்க்", "#1f7a46", 10], ["Copper", "செம்பு", "#c27a3c", 8], ["FR-4 core", "FR-4 உள்ளகம்", "#d8c58f", 34], ["Copper", "செம்பு", "#c27a3c", 8], ["Solder mask", "சோல்டர் மாஸ்க்", "#1f7a46", 10]];
  let y = 10, s = "";
  L.forEach(([a, b, col, h]) => {
    s += `<rect x="10" y="${y}" width="260" height="${h}" fill="${col}" ${col.startsWith("var") ? 'class="silklayer"' : ""}/>`;
    s += `<line x1="272" x2="292" y1="${y + h / 2}" y2="${y + h / 2}" class="ln"/><text x="298" y="${y + h / 2}" class="lt" dominant-baseline="central">${LANG === "ta" ? b : a}${LANG === "both" ? " · " + b : ""}</text>`;
    y += h + 2;
  });
  s += `<rect x="120" y="16" width="16" height="74" fill="#c27a3c" opacity=".9"/><text x="128" y="104" class="lt" text-anchor="middle">via</text>`;
  s += `<rect x="40" y="2" width="40" height="12" rx="1" fill="#17181b"/><text x="60" y="-2" class="lt" text-anchor="middle">SMD</text>`;
  return `<svg viewBox="0 -14 480 124" class="layers" role="img" aria-label="PCB layer stack"><g>${s}</g></svg>`;
}
function renderBasics() {
  $("#v-basics").innerHTML = `
    <div class="pagehead"><h1>${tx(UI.basicsTitle)}</h1><p class="lede">${tx(UI.basicsSub)}</p></div>
    <figure class="layerfig"><div class="scrollx">${layerSVG()}</div><figcaption>${tx(UI.layers)}</figcaption></figure>
    <div class="bgrid">${BASICS.map((t, i) => `<article class="bcard"><span class="bn">${String(i + 1).padStart(2, "0")}</span><h3>${tx([t[0], t[1]])}</h3><p>${tx([t[2], t[3]])}</p></article>`).join("")}</div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const lb = e.target.closest(".lang button");
  if (lb) { LANG = lb.dataset.l; store.set("lang", LANG); render(); return; }
  const chip = e.target.closest(".chip[data-cat]");
  if (chip) { S.cat = chip.dataset.cat; renderLib(); return; }
  const dd = e.target.closest(".dd-item");
  if (dd) { openResult(dd.dataset.type, dd.dataset.id); return; }
  const pb = e.target.closest(".pbtn");
  if (pb) { select(+pb.dataset.i, true); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav) { const b = findB(S.board), n = b.c.length; select(((S.sel ?? -1) + +nav.dataset.nav + n) % n, false); return; }
  const cb = e.target.closest(".cb[data-act]");
  if (cb) {
    const a = cb.dataset.act;
    if (a === "rl") S.rz = (Math.round(S.rz / 90) * 90 - 90 + 360) % 360;
    if (a === "rr") S.rz = (Math.round(S.rz / 90) * 90 + 90) % 360;
    if (a === "flip") S.flip = !S.flip;
    if (a === "tilt") S.tilt = !S.tilt;
    if (a === "zi") S.zoom = Math.min(2.4, +(S.zoom + 0.2).toFixed(2));
    if (a === "zo") S.zoom = Math.max(0.6, +(S.zoom - 0.2).toFixed(2));
    if (a === "nums") { S.nums = !S.nums; cb.setAttribute("aria-pressed", S.nums); $("#b3d").classList.toggle("nonum", !S.nums); return; }
    if (a === "reset") Object.assign(S, { rz: 0, tx: 0, ty: 0, flip: false, zoom: 1, tilt: false });
    if (a === "speak") { speak(); return; }
    applyT(false);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "rot") { S.rz = +e.target.value; applyT(false); }
  if (e.target.id === "q") {
    S.q = e.target.value; ddIndex = -1; renderDropdown();
    if (S.view === "lib") renderLib();
    if (S.view === "parts") renderParts();
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "q") {
    const items = $$(".dd-item");
    if (e.key === "ArrowDown") { ddIndex = Math.min(items.length - 1, ddIndex + 1); renderDropdown(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { ddIndex = Math.max(0, ddIndex - 1); renderDropdown(); e.preventDefault(); }
    else if (e.key === "Enter") {
      const res = searchAll(S.q.trim()); const r = res[Math.max(0, ddIndex)];
      if (r) openResult(r.type, r.id); e.preventDefault();
    } else if (e.key === "Escape") { $("#dd").hidden = true; e.target.blur(); }
    return;
  }
  if (S.view === "board" && !e.target.closest("input,textarea")) {
    if (e.key === "ArrowRight" && e.altKey === false && e.target.tagName !== "INPUT") { if (S.sel != null || e.shiftKey) { const n = findB(S.board).c.length; select(((S.sel ?? -1) + 1) % n, false); } }
    if (e.key === "ArrowLeft" && e.target.tagName !== "INPUT") { if (S.sel != null) { const n = findB(S.board).c.length; select((S.sel - 1 + n) % n, false); } }
  }
});
$("#q").addEventListener("focus", renderDropdown);
$("#dd").addEventListener("mousedown", e => e.preventDefault());
$("#q").addEventListener("blur", () => setTimeout(() => { $("#dd").hidden = true; }, 180));
$("#searchform").addEventListener("submit", e => e.preventDefault());
window.addEventListener("hashchange", route);
let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.view === "board") applyT(true); }, 80); });

route();
</script>
</body></html>
